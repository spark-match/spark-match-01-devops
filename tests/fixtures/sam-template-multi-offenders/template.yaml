AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >-
  SAM template with three AWS::Lambda::Permission resources that lack both
  SourceArn and SourceAccount. Used to verify the scanner reports all of
  them in a single pass (multi-offender detection), not just the first.

Resources:
  # An S3 bucket to verify non-Permission resources are NOT flagged.
  SomeOtherResource:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: my-bucket

  # Offender 1 — apigateway authorizer permission, no SourceArn/SourceAccount.
  AuthorizerFunctionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref AuthorizerFunction
      Principal: apigateway.amazonaws.com

  # Offender 2 — events rule permission, no SourceArn/SourceAccount.
  ScheduledFunctionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ScheduledFunction
      Principal: events.amazonaws.com

  # Offender 3 — SNS topic permission, no SourceArn/SourceAccount.
  SnsPublishFunctionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref SnsPublishFunction
      Principal: sns.amazonaws.com

  # Offender 4 — same shape but a SECOND apigateway permission.
  SecondAuthorizerFunctionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref SecondAuthorizerFunction
      Principal: apigateway.amazonaws.com

  # A valid (compliant) permission with SourceArn — must NOT be flagged.
  ValidApiGatewayPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ValidFunction
      Principal: apigateway.amazonaws.com
      SourceArn: arn:aws:execute-api:us-east-1:123456789012:abc/*

  # A valid permission with SourceAccount only — must NOT be flagged.
  SourceAccountOnlyPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref SourceAccountFunction
      Principal: apigateway.amazonaws.com
      SourceAccount: '123456789012'