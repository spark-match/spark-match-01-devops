# =============================================================================
# CodeQL - Static analysis for GitHub Actions YAML workflows
# =============================================================================
# Purpose:
#   Standalone CodeQL workflow that scans THIS REPOSITORY'S OWN GitHub Actions
#   YAML files under .github/workflows/ for security misconfigurations
#   (untrusted input, script injection, expression injection, etc.).
#
# Scope:
#   - language: actions (CodeQL query pack for GitHub Actions YAML)
#   - NOT javascript/typescript: reusable-codeql.yml (the reusable workflow) is the
#     entry point for app repos that need TS/JS analysis.
#   - NOT bash: CodeQL does not support bash as a built-in language. Shell
#     scripts under scripts/ are validated separately by shellcheck (in
#     reusable-quality.yml).
#
# Triggers:
#   - push to main             (defense in depth on every merge)
#   - pull_request to main     (gate before merge)
#   - weekly Monday 06:17 UTC  (low contention slot)
#
# Required: Code scanning alerts must be reviewed and triaged periodically.
# =============================================================================

name: CodeQL (actions)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'

permissions:
  actions: read
  contents: read
  security-events: write

# Cancel in-progress runs for the same ref. CodeQL is idempotent and the
# `init` action handles cancellation safely by short-circuiting.
concurrency:
  group: codeql-actions-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
          config-file: .github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"