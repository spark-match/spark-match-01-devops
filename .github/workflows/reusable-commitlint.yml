name: reusable-commitlint

on:
  workflow_call:
    inputs:
      config-file:
        description: "Path to the commitlint config file, relative to repo root."
        type: string
        required: false
        default: .commitlintrc.json
      commit-depth:
        description: "Number of commits to lint from the PR head (passed to wagoid/commitlint-github-action as commitDepth)."
        type: number
        required: false
        default: 2
      help-url:
        description: "URL shown in the commitlint report when a commit fails. Typically the AGENTS.md of the consumer repo."
        type: string
        required: false
        default: ""
      skip-release-please:
        description: "When true, skips commitlint for release-please branches (refs starting with 'release-please--') and for push events whose head commit message starts with 'release '. Mirrors the skip logic the consumer workflow would otherwise have to duplicate."
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  lint-commits:
    # Nombre ESTATICO a proposito. Antes era
    # "commitlint-${{ github.event.pull_request.head.ref || github.ref_name }}",
    # y meter la rama dentro del nombre del job rompe los required status
    # checks: el contexto que GitHub publica es "<job-id-del-caller> /
    # <nombre-del-job>", asi que en un PR salia "lint-commits /
    # commitlint-mi-rama" y cambiaba en cada rama. Un check requerido necesita
    # un nombre fijo -- si no, el ruleset espera un contexto que no llega nunca
    # y el PR se queda colgado en "Expected - Waiting for status to be
    # reported" para siempre.
    name: commitlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: checkout-repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Skipped on a force-push, and that is not a loophole -- see below.
      #
      # A force-push rewrites history, so `github.event.before` points at a
      # commit the branch no longer descends from. The range before..after then
      # spans unrelated history, and `commitDepth` does not save you: the
      # action takes commits from the START of that range, so the deeper the
      # rewrite the older the commits it lints.
      #
      # Measured on spark-match-03-backend, 2026-08-07. The `dev` fast-forward
      # onto `main` produced a range covering main's whole promotion history,
      # and with commitDepth 2 the job linted the two OLDEST commits in it:
      # `chore(codeowners): migrate spark-match-03-backend to explicit paths`
      # and `chore(sync): dev -> main with hardening cycle (#29)`. The first
      # failed on scope-enum because `codeowners` is not in the allowlist --
      # true today, and irrelevant: that commit landed weeks ago, was valid
      # under the rules of its time, and has been sitting on `main` ever since.
      # The same thing happened on spark-match-02-infrastructure's first
      # fast-forward, with two commits from 13 July.
      #
      # Nothing goes unchecked. Every commit a force-push moves has already
      # been linted on the pull request that introduced it; this event is the
      # promotion, not the authoring. And on these repositories a force-push to
      # a protected branch only happens through the ruleset window that the
      # fast-forward procedure opens and closes deliberately.
      #
      # The alternative was leaving `dev` permanently red after every promotion
      # cycle, with a failure that says nothing about the code being promoted.
      # A red signal nobody can act on is one nobody reads.
      - name: run-commitlint
        if: ${{
            !(github.event_name == 'push' && github.event.forced)
            && !(inputs.skip-release-please
              && (
                (github.event_name == 'pull_request' && startsWith(github.event.pull_request.head.ref, 'release-please--'))
                || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release '))
              ))
          }}
        uses: wagoid/commitlint-github-action@v6
        with:
          configFile: ${{ inputs.config-file }}
          commitDepth: ${{ inputs.commit-depth }}
          failOnErrors: true
          helpURL: ${{ inputs.help-url }}
