# =============================================================================
# Reusable Workflow: Actionlint - GitHub Actions syntax validation
# =============================================================================
# Atomic recipe (ecosystem layer). Validates the syntax of GitHub Actions
# workflow YAML files in the caller's repository. No AWS, no Node.
#
# USAGE (in caller repo):
#   jobs:
#     actionlint:
#       uses: spark-match/spark-match-01-devops/.github/workflows/actionlint.yml@main
#       with:
#         environment-name: dev   # informational only (job name + logs)
#
# Inputs:
#   environment-name: Target GH Environment name for context only. NOTE: this
#                     recipe does NOT reference the GH Environment as a gate
#                     (no secrets are needed). The value is baked into the
#                     job name and step logs so PR reviewers can see which
#                     env the check ran against.
#
# Cross-owner safe: works for any caller (org or user-owned) since no secrets
# are forwarded.
# =============================================================================

name: Actionlint

on:
  workflow_call:
    inputs:
      environment-name:
        description: 'Target environment name (informational, used in job name and logs).'
        type: string
        required: false
        default: 'dev'

permissions:
  contents: read

jobs:
  actionlint:
    name: "actionlint (env=${{ inputs.environment-name }})"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate inputs
        uses: spark-match/spark-match-01-devops/.github/actions/validate-workflow-inputs@d8b128c31046b475be607d6e04daa281590ac3cc  # main
        with:
          values: |
            {"environment-name": "${{ inputs.environment-name }}"}
      - name: Checkout caller repository
        uses: actions/checkout@v7

      - name: Download actionlint binary (pinned v1.7.7)
        id: get_actionlint
        shell: bash
        # Pin to v1.7.7. Avoid `main` branch because that would be a
        # moving target (supply chain risk if the upstream repo is
        # compromised). Update this pin when bumping.
        #
        # The install script's signature is:
        #   bash download-actionlint.bash [VERSION] [DIR]
        # VERSION defaults to "latest" if omitted — so we MUST pass it
        # explicitly to honour the pin (without it the script silently
        # installs the latest release even though the URL says v1.7.7).
        # VERSION is semver only ("1.7.7"), NOT the "v1.7.7" tag-prefix
        # GitHub uses in the URL — the script rejects "v" with exit 1.
        #
        # Use `curl | bash -s --` rather than `bash <(curl ...)`. With
        # the latter, a failed curl makes bash run an empty script body
        # and exit 0 — which then leaves `outputs.executable` empty and
        # causes the next step to run `-color` (exit 127). The pipe form
        # propagates curl's exit code through pipefail.
        #
        # `--retry 3 --retry-delay 5` smooths over transient connection
        # resets on the GitHub-hosted runner.
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/actionlint-bin"
          mkdir -p "$install_dir"
          curl --fail --silent --show-error --location --retry 3 --retry-delay 5 \
            https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash \
            | bash -s -- 1.7.7 "$install_dir"
          executable="$install_dir/actionlint"
          if [[ ! -x "$executable" ]]; then
            echo "::error::actionlint binary not found at $executable after install"
            exit 1
          fi
          echo "executable=$executable" >> "$GITHUB_OUTPUT"
          echo "Installed: $("$executable" --version)"

      - name: Run actionlint
        # Quote the whole command so YAML parses it as a single string
        # value (a single-quoted prefix `'"...""...""'"` followed by
        # ` -color` parses as two scalars and the file fails YAML
        # validation — GitHub then refuses to schedule any jobs for
        # the PR). `$RUNNER_TEMP/actionlint-bin/actionlint` has no
        # spaces, but quoting is harmless and avoids the pitfall if
        # the install path ever changes.
        run: "${{ steps.get_actionlint.outputs.executable }} -color"
