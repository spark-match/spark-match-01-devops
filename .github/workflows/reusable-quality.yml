name: quality

on:
  workflow_call:
    inputs:
      environment-name:
        description: 'Target environment name (informational).'
        type: string
        required: false
        default: 'dev'
      shellcheck-severity:
        description: 'Minimum shellcheck severity to gate on (warning|error|info|style).'
        type: string
        required: false
        default: 'warning'
      schema-strict:
        description: 'If true, schema validation fails on additionalProperties.'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  shellcheck:
    name: "shellcheck-${{ inputs.environment-name }}"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: validate-inputs
        uses: spark-match/spark-match-01-devops/.github/actions/validate-workflow-inputs@main
        with:
          values: |
            {"environment-name": "${{ inputs.environment-name }}", "shellcheck-severity": "${{ inputs.shellcheck-severity }}"}
          enums: |
            {"shellcheck-severity": ["warning", "error", "info", "style"]}
      - name: checkout-caller-repository
        uses: actions/checkout@v7
      - name: run-shellcheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          additional_files: "scripts .github/actions tests/bats/helpers"
          severity: ${{ inputs.shellcheck-severity }}
          ignore_paths: 'tests/bats'
  manifest-schema:
    name: "manifest-schema-${{ inputs.environment-name }}"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: validate-inputs
        uses: spark-match/spark-match-01-devops/.github/actions/validate-workflow-inputs@main
        with:
          values: |
            {"environment-name": "${{ inputs.environment-name }}", "schema-strict": "${{ inputs.schema-strict }}"}
          enums: |
            {}
      - name: checkout-caller-repository
        uses: actions/checkout@v7
      - name: setup-python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: install-check-json-schema
        run: pip install --quiet check-jsonschema==0.30.0
      - name: validate-manifest-schema
        run: |
          check-jsonschema \
            --schemafile governance/repository-governance.schema.json \
            governance/repository-governance.json
  bats:
    name: "bats-${{ inputs.environment-name }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: checkout-caller-repository
        uses: actions/checkout@v7
      - name: run-bats-tests
        uses: ./.github/actions/bats-runner
