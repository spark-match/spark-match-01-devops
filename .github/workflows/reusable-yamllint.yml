name: yamllint

on:
  workflow_call:
    inputs:
      environment-name:
        description: 'Target environment name (informational, used in job name and logs).'
        type: string
        required: false
        default: 'dev'

permissions:
  contents: read

jobs:
  yamllint:
    name: "yamllint-${{ inputs.environment-name }}"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: validate-inputs
        uses: spark-match/spark-match-01-devops/.github/actions/validate-workflow-inputs@main
        with:
          values: |
            {"environment-name": "${{ inputs.environment-name }}"}
      - name: checkout-caller-repository
        uses: actions/checkout@v7
      - name: install-yamllint
        run: pip install --quiet yamllint==1.35.1
      - name: run-yamllint
        run: yamllint .
