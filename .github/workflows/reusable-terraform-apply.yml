# =============================================================================
# Reusable Workflow: terraform-apply (N-environment aware)
# =============================================================================
# Runs `terraform plan` then `terraform apply` against a caller-provided
# working directory. Uses GitHub Environment as approval gate (configurable
# via the caller). Designed to be invoked per environment from a caller with
# N jobs.
#
# USAGE (in caller repo, single env):
#   jobs:
#     apply-prod:
#       uses: spark-match/spark-match-01-devops/.github/workflows/reusable-terraform-apply.yml@main
#       with:
#         environment: prod
#         working-directory: live/prod
#         apply-role-arn-secret: AWS_APPLY_ROLE_ARN_PROD
#         gh-environment: production
#
# Required GitHub Secret in caller repo: <apply-role-arn-secret>
# Required GH Environment: <gh-environment> (configured by repo admin)
#
# NOTE: The `gh-environment` field of the job is evaluated BEFORE any step
# runs, so it cannot reference step outputs. It uses an expression fallback:
#   ${{ inputs.gh-environment || inputs.environment }}
# If both are empty, the workflow fails (caller bug).
# =============================================================================

name: terraform-apply

on:
  workflow_call:
    secrets:
      AWS_APPLY_ROLE_ARN:
        description: 'OIDC role ARN for terraform apply (assumed via aws-actions/configure-aws-credentials). Caller passes the value of its per-env secret (e.g. AWS_APPLY_ROLE_ARN_PROD). Required because cross-owner callers cannot use secrets: inherit.'
        required: true
    inputs:
      environment:
        description: 'Environment identifier (e.g. "dev", "staging", "prod"). Used for artifact naming, display, concurrency group. Defaults to basename of working-directory. Deprecated alias: prefer `environment-name`.'
        type: string
        required: false
        default: ''
      environment-name:
        description: 'Preferred alias for `environment`. If set, takes precedence over the legacy `environment` input.'
        type: string
        required: false
        default: ''
      working-directory:
        description: 'Directory containing the Terraform configuration.'
        type: string
        required: false
        default: '.'
      aws-region:
        description: 'AWS region to deploy to.'
        type: string
        required: false
        default: 'us-east-1'
      apply-role-arn-secret:
        description: 'Name of the GitHub Secret containing the OIDC role ARN for apply (e.g. AWS_APPLY_ROLE_ARN_DEV).'
        type: string
        required: false
        default: 'AWS_APPLY_ROLE_ARN'
      apply-role-arn:
        description: 'OIDC role ARN value passed directly as a string input. Use this instead of apply-role-arn-secret when calling cross-owner to avoid GitHub masking the value. Identifiers are not credentials.'
        type: string
        required: false
        default: ''
      terraform-version:
        description: 'Terraform version to use.'
        type: string
        required: false
        default: '1.10.0'
      backend-bucket:
        description: 'S3 bucket name for Terraform state.'
        type: string
        required: false
        default: ''
      backend-key:
        description: 'S3 key (path) for the Terraform state file.'
        type: string
        required: false
        default: 'terraform.tfstate'
      tfvars-file:
        description: 'Optional path to a tfvars file passed as -var-file. Empty = use committed terraform.tfvars.'
        type: string
        required: false
        default: ''
      var-files:
        description: 'Comma-separated list of additional tfvars files (additive). Empty = none.'
        type: string
        required: false
        default: ''
      target:
        description: 'Optional Terraform target (e.g. "module.security"). Empty = no target.'
        type: string
        required: false
        default: ''
      extra-args:
        description: 'Additional raw terraform CLI flags appended to plan. Use sparingly.'
        type: string
        required: false
        default: ''
      gh-environment:
        description: 'GitHub Environment name (used as approval gate). Falls back to inputs.environment. Required for production deploys.'
        type: string
        required: false
        default: ''
      auto-approve:
        description: 'If true, skip GH Environment approval gate (the GH Environment must have no required reviewers). Only use for non-prod envs. Default false.'
        type: boolean
        required: false
        default: false
      drift-only:
        description: 'If true, run plan only and post summary; do NOT apply. Useful for scheduled drift detection. Default false.'
        type: boolean
        required: false
        default: false
    outputs:
      apply-success:
        description: 'Whether the apply succeeded (true/false). False in drift-only mode if plan errored.'
        value: ${{ jobs.apply.outputs.apply-success }}
      has-changes:
        description: 'Whether the plan had resource changes.'
        value: ${{ jobs.apply.outputs.has-changes }}
      environment:
        description: 'Environment identifier echoed back.'
        value: ${{ jobs.apply.outputs.environment }}

# Concurrency group keyed by resolved environment (env || working-directory basename)
# and the working directory. Prevents concurrent applies to the same env.
concurrency:
  group: ${{ inputs.environment-name || inputs.environment || inputs.working-directory }}-apply-${{ inputs.working-directory }}
  cancel-in-progress: false

permissions:
  id-token: write          # For OIDC
  contents: read
  pull-requests: write

jobs:
  apply:
    name: apply-${{ inputs.environment-name || inputs.environment || inputs.working-directory }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # GH Environment uses input fallback: gh-environment > environment.
    # This is evaluated before any step runs, so it can't reference step outputs.
    environment: ${{ inputs.gh-environment || inputs.environment-name || inputs.environment }}
    outputs:
      apply-success: ${{ steps.apply.outputs.apply-success }}
      has-changes: ${{ steps.plan.outputs.has-changes }}
      environment: ${{ steps.env.outputs.environment }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
        shell: bash

    steps:
      - name: validate-inputs
        uses: spark-match/spark-match-01-devops/.github/actions/validate-workflow-inputs@main
        with:
          values: |
            {"working-directory": "${{ inputs.working-directory }}","aws-region": "${{ inputs.aws-region }}","terraform-version": "${{ inputs.terraform-version }}"}
          required: working-directory
          patterns: |
            {"terraform-version": "^[0-9]+\\.[0-9]+\\.[0-9]+$"}
      - name: resolve-environment-identifier
        id: env
        # Este step corre ANTES de checkout, asi que el working-directory del
        # caller (e.g. live/dev) aun no existe. Forzamos working-directory: .
        # para que GitHub no intente hacer cd a un dir que no existe.
        working-directory: .
        run: |
          if [ -n "${INPUTS_ENVIRONMENT_NAME}" ]; then
            ENV="${INPUTS_ENVIRONMENT_NAME}"
          elif [ -n "${INPUTS_ENVIRONMENT}" ]; then
            ENV="${INPUTS_ENVIRONMENT}"
          else
            ENV=$(basename "${INPUTS_WORKING_DIRECTORY}")
          fi
          echo "environment=${ENV}" >> "$GITHUB_OUTPUT"
          echo "Resolved env=${ENV} | gh-env=${INPUTS_GH_ENVIRONMENT} | auto-approve=${INPUTS_AUTO_APPROVE} | drift-only=${INPUTS_DRIFT_ONLY}"

        env:
          INPUTS_ENVIRONMENT_NAME: ${{ inputs.environment-name }}
          INPUTS_ENVIRONMENT: ${{ inputs.environment }}
          INPUTS_WORKING_DIRECTORY: ${{ inputs.working-directory }}
          INPUTS_GH_ENVIRONMENT: ${{ inputs.gh-environment || inputs.environment-name || inputs.environment }}
          INPUTS_AUTO_APPROVE: ${{ inputs.auto-approve }}
          INPUTS_DRIFT_ONLY: ${{ inputs.drift-only }}
      - name: checkout-caller-repository
        uses: actions/checkout@v7


      - name: setup-terraform-${{ inputs.terraform-version }}
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ inputs.terraform-version }}
          # terraform_wrapper: false — the wrapper eats exit code 2 from
          # -detailed-exitcode, breaking has-changes detection. Disable it
          # so raw terraform exit codes pass through to the script.
          terraform_wrapper: false

      - name: configure-aws-credentials-oidc-apply-role
        # Resolve role ARN from two paths (string input preferred to avoid
        # cross-owner secret masking). See reusable-terraform-plan.yml for
        # the full rationale.
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.apply-role-arn != '' && inputs.apply-role-arn || secrets[inputs.apply-role-arn-secret] }}
          aws-region: ${{ inputs.aws-region }}

      - name: terraform-fmt
        run: terraform fmt -check -recursive -diff

      - name: create-plugin-cache-directory
        run: mkdir -p "${GITHUB_WORKSPACE}/.terraform.d/plugin-cache"

        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
      - name: terraform-init
        run: |
          INIT_ARGS=(-input=false)
          if [ -n "${INPUTS_BACKEND_BUCKET}" ]; then
            INIT_ARGS+=(
              -backend-config=bucket="${INPUTS_BACKEND_BUCKET}"
              -backend-config=key="${INPUTS_BACKEND_KEY}"
              -backend-config=region="${INPUTS_AWS_REGION}"
              -backend-config=use_lockfile=true
            )
          else
            INIT_ARGS+=(-backend=false)
          fi
          echo "Running: terraform init ${INIT_ARGS[*]}"
          terraform init "${INIT_ARGS[@]}"
        env:
          TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform.d/plugin-cache
          INPUTS_BACKEND_BUCKET: ${{ inputs.backend-bucket }}
          INPUTS_BACKEND_KEY: ${{ inputs.backend-key }}
          INPUTS_AWS_REGION: ${{ inputs.aws-region }}
      - name: terraform-validate
        run: terraform validate -no-color

      - name: terraform-plan
        id: plan
        run: |
          set +e
          # Note: -lock=false here because the next step (apply) acquires
          # the S3 native lockfile. Holding it during plan would block
          # other workflows.
          # -detailed-exitcode: exit 2 when plan has changes (required for
          # has-changes detection; without it plan always exits 0 and apply
          # never runs).
          PLAN_ARGS="-input=false -no-color -lock=false -detailed-exitcode -out=tfplan"
          if [ -n "${INPUTS_TFVARS_FILE}" ]; then
            PLAN_ARGS="$PLAN_ARGS -var-file=${INPUTS_TFVARS_FILE}"
          fi
          if [ -n "${INPUTS_VAR_FILES}" ]; then
            IFS=',' read -ra FILES <<< "${INPUTS_VAR_FILES}"
            for f in "${FILES[@]}"; do
              PLAN_ARGS="$PLAN_ARGS -var-file=$f"
            done
          fi
          if [ -n "${INPUTS_TARGET}" ]; then
            PLAN_ARGS="$PLAN_ARGS -target=${INPUTS_TARGET}"
          fi
          if [ -n "${INPUTS_EXTRA_ARGS}" ]; then
            PLAN_ARGS="$PLAN_ARGS ${INPUTS_EXTRA_ARGS}"
          fi
          echo "Running: terraform plan $PLAN_ARGS"
          # shellcheck disable=SC2086
          terraform plan $PLAN_ARGS
          EXIT_CODE=$?
          set -e
          echo "plan-exit-code=${EXIT_CODE}" >> "$GITHUB_OUTPUT"
          if [ "${EXIT_CODE}" = "2" ]; then
            echo "has-changes=true" >> "$GITHUB_OUTPUT"
          else
            # 0 = no changes, 1 = error
            echo "has-changes=false" >> "$GITHUB_OUTPUT"
          fi

        env:
          INPUTS_TFVARS_FILE: ${{ inputs.tfvars-file }}
          INPUTS_VAR_FILES: ${{ inputs.var-files }}
          INPUTS_TARGET: ${{ inputs.target }}
          INPUTS_EXTRA_ARGS: ${{ inputs.extra-args }}
      - name: convert-plan-to-json
        if: steps.plan.outputs.has-changes == 'true'
        run: terraform show -json tfplan > tfplan.json

      - name: generate-plan-summary
        if: steps.plan.outputs.has-changes == 'true'
        run: |
          ENV="${STEPS_ENV_OUTPUTS_ENVIRONMENT}"
          WD="${INPUTS_WORKING_DIRECTORY}"
          REGION="${INPUTS_AWS_REGION}"
          {
            echo "## terraform-apply plan -- \`${ENV}\`"
            echo ""
            if [ "${INPUTS_DRIFT_ONLY}" = "true" ]; then
              echo "**Mode:** drift-only (no apply)"
              echo ""
            fi
            echo "| Field | Value |"
            echo "|:---|:---|"
            echo "| Environment | \`${ENV}\` |"
            echo "| Working directory | \`${WD}\` |"
            echo "| AWS region | \`${REGION}\` |"
            echo "| State bucket | \`${INPUTS_BACKEND_BUCKET}\` |"
            echo "| State key | \`${INPUTS_BACKEND_KEY}\` |"
            echo ""
            echo "| Resource | Change |"
            echo "|:---|:---|"
            jq -r '
              .resource_changes[]
              | "| \(.address) | \(.change.actions | tostring | gsub("[\"\\[\\]]"; "")) |"
            ' tfplan.json || echo "_(no resource changes)_"
          } >> "$GITHUB_STEP_SUMMARY"

        env:
          INPUTS_WORKING_DIRECTORY: ${{ inputs.working-directory }}
          INPUTS_AWS_REGION: ${{ inputs.aws-region }}
          INPUTS_DRIFT_ONLY: ${{ inputs.drift-only }}
          INPUTS_BACKEND_BUCKET: ${{ inputs.backend-bucket }}
          INPUTS_BACKEND_KEY: ${{ inputs.backend-key }}
          STEPS_ENV_OUTPUTS_ENVIRONMENT: ${{ steps.env.outputs.environment }}
      - name: terraform-apply
        id: apply
        if: steps.plan.outputs.has-changes == 'true' && inputs.drift-only != 'true'
        run: |
          set +e
          terraform apply -input=false tfplan
          EXIT_CODE=$?
          set -e
          if [ "${EXIT_CODE}" = "0" ]; then
            echo "apply-success=true" >> "$GITHUB_OUTPUT"
          else
            echo "apply-success=false" >> "$GITHUB_OUTPUT"
          fi

      - name: apply-result-summary
        if: always()
        run: |
          {
            echo "## terraform-apply result -- \`${STEPS_ENV_OUTPUTS_ENVIRONMENT}\`"
            echo ""
            if [ "${INPUTS_DRIFT_ONLY}" = "true" ]; then
              echo "Mode: **drift-only** (plan completed, no apply performed)"
              if [ "${STEPS_PLAN_OUTPUTS_HAS_CHANGES}" = "true" ]; then
                echo ""
                echo "> Drift detected: see plan summary above."
              else
                echo ""
                echo "> No drift."
              fi
            elif [ "${STEPS_APPLY_OUTPUTS_APPLY_SUCCESS}" = "true" ]; then
              echo "Status: **Success**"
              echo ""
              echo "Triggered by: @${GITHUB_ACTOR}"
              echo "Commit: ${GITHUB_SHA}"
              echo "Environment: ${STEPS_ENV_OUTPUTS_ENVIRONMENT}"
            elif [ "${STEPS_PLAN_OUTPUTS_HAS_CHANGES}" = "true" ]; then
              echo "Status: **Failed** (apply error)"
            else
              echo "Status: **No changes** (nothing to apply)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

        env:
          INPUTS_DRIFT_ONLY: ${{ inputs.drift-only }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_SHA: ${{ github.sha }}
          STEPS_ENV_OUTPUTS_ENVIRONMENT: ${{ steps.env.outputs.environment }}
          STEPS_PLAN_OUTPUTS_HAS_CHANGES: ${{ steps.plan.outputs.has-changes }}
          STEPS_APPLY_OUTPUTS_APPLY_SUCCESS: ${{ steps.apply.outputs.apply-success }}
      - name: notify-on-apply-failure
        if: failure() && steps.apply.outputs.apply-success != 'true' && inputs.drift-only != 'true'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: terraform-apply-failed-${{ steps.env.outputs.environment }}
          message: |
            ## terraform-apply failed -- `${{ steps.env.outputs.environment }}`

            Working directory: `${{ inputs.working-directory }}`
            Commit: ${{ github.sha }}
            Author: @${{ github.actor }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Please investigate. The state file may have partial changes if apply was interrupted.

            To recover:
            1. Check CloudTrail for what was created/modified
            2. Run `terraform plan` locally to see the drift
            3. Decide whether to manually fix or re-run this workflow

      - name: notify-on-drift-detected
        if: always() && inputs.drift-only == 'true' && steps.plan.outputs.has-changes == 'true'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: terraform-drift-${{ steps.env.outputs.environment }}
          message: |
            ## terraform-drift detected -- `${{ steps.env.outputs.environment }}`

            Scheduled drift detection found changes outside of Terraform.
            See [Job Summary](../../actions/runs/${{ github.run_id }}) for the resource change table.
