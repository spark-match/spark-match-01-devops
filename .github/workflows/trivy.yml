# =============================================================================
# Reusable Workflow: Trivy - filesystem / image / IaC scan
# =============================================================================
# Atomic recipe (ecosystem layer). Runs Aqua Trivy against the caller's
# repository. Supports three scan types:
#   - fs     : scan the repo filesystem (Dockerfile misconfig, secrets,
#              lockfile dependency CVEs, IaC misconfig).
#   - image  : scan a container image (OS pkg vulns, library vulns).
#              `image-ref` MUST be set when scan-type=image.
#   - config : IaC config scan (Terraform, Kubernetes, Dockerfile, ...).
#
# Severity threshold is configurable via `severity:` (default CRITICAL).
# The workflow fails when trivy returns exit code 1 (matching the `exit-code`
# input, default 1), so callers can tighten or relax by overriding.
#
# USAGE (caller repo, fs scan example):
#   jobs:
#     trivy:
#       uses: spark-match/spark-match-01-devops/.github/workflows/trivy.yml@main
#       with:
#         scan-type: fs
#
# USAGE (caller repo, image scan example):
#   jobs:
#     trivy:
#       uses: spark-match/spark-match-01-devops/.github/workflows/trivy.yml@main
#       with:
#         scan-type: image
#         image-ref: my-org/my-app:${{ github.sha }}
#
# Cross-owner safe: only uses the auto-provisioned GITHUB_TOKEN. The trivy
# image scan mode requires the caller to authenticate to the registry via
# the standard registry-specific env vars (TRIVY_USERNAME / TRIVY_PASSWORD /
# AWS_* / GOOGLE_APPLICATION_CREDENTIALS). This workflow does NOT forward
# any caller secret by name; the caller must inject what their registry
# needs via the `env:` block on the calling job.
#
# Pin: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
#   = v0.36.0 (released 2026-04-22). See dependabot.yml for the
#   github-actions ecosystem config that will bump this.
# =============================================================================

name: Trivy

on:
  workflow_call:
    inputs:
      scan-type:
        description: 'Trivy scan type. One of: fs (filesystem), image (container image), config (IaC config). Default fs.'
        type: string
        required: false
        default: 'fs'
      scan-ref:
        description: 'Path to scan when scan-type is fs or config. Default "." (repo root). Ignored when scan-type is image.'
        type: string
        required: false
        default: '.'
      image-ref:
        description: 'Container image reference when scan-type is image (e.g. "my-org/my-app:latest" or full ECR URI). Required when scan-type=image.'
        type: string
        required: false
        default: ''
      severity:
        description: 'Comma-separated severity list. Trivy fails when issues at or above these levels are found. Default CRITICAL.'
        type: string
        required: false
        default: 'CRITICAL'
      format:
        description: 'Output format. table for human-readable, sarif for upload to GitHub Security tab. Default table.'
        type: string
        required: false
        default: 'table'
      exit-code:
        description: 'Trivy exit code when vulnerabilities matching severity are found. Default 1 (fail the workflow).'
        type: string
        required: false
        default: '1'
      ignore-unfixed:
        description: 'Skip vulnerabilities that have no released fix. Default true to reduce noise from upstream-pending CVEs.'
        type: boolean
        required: false
        default: true
      timeout:
        description: 'Trivy scan timeout. Default 5m0s.'
        type: string
        required: false
        default: '5m0s'
      scanners:
        description: 'Comma-separated scanner list: vuln, secret, misconfig, license. Default vuln,secret,misconfig.'
        type: string
        required: false
        default: 'vuln,secret,misconfig'

permissions:
  contents: read
  security-events: write

concurrency:
  group: trivy-${{ inputs.scan-type }}-${{ inputs.image-ref || inputs.scan-ref }}
  cancel-in-progress: false

jobs:
  trivy:
    name: "trivy (${{ inputs.scan-type }}:${{ inputs.image-ref || inputs.scan-ref }})"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate inputs
        uses: spark-match/spark-match-01-devops/.github/actions/validate-workflow-inputs@d8b128c31046b475be607d6e04daa281590ac3cc  # main
        with:
          values: |
            {
              "scan-type": "${{ inputs.scan-type }}",
              "scan-ref": "${{ inputs.scan-ref }}",
              "image-ref": "${{ inputs.image-ref }}",
              "severity": "${{ inputs.severity }}",
              "format": "${{ inputs.format }}"
            }
          enums: |
            {
              "scan-type": ["fs", "image", "config"],
              "format": ["table", "sarif"]
            }
          patterns: |
            {
              "scan-ref": "^.{1,1024}$",
              "image-ref": "^.{0,1024}$"
            }

      - name: Checkout caller repository
        uses: actions/checkout@v7

      - name: Run Trivy scan (fs or config)
        if: ${{ inputs.scan-type != 'image' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: ${{ inputs.scan-type }}
          scan-ref: ${{ inputs.scan-ref }}
          format: ${{ inputs.format }}
          exit-code: ${{ inputs.exit-code }}
          ignore-unfixed: ${{ inputs.ignore-unfixed }}
          severity: ${{ inputs.severity }}
          timeout: ${{ inputs.timeout }}
          scanners: ${{ inputs.scanners }}
          hide-progress: 'true'

      - name: Run Trivy scan (image)
        if: ${{ inputs.scan-type == 'image' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ inputs.image-ref }}
          format: ${{ inputs.format }}
          exit-code: ${{ inputs.exit-code }}
          ignore-unfixed: ${{ inputs.ignore-unfixed }}
          severity: ${{ inputs.severity }}
          timeout: ${{ inputs.timeout }}
          scanners: ${{ inputs.scanners }}
          hide-progress: 'true'

      - name: Upload SARIF to GitHub Security tab
        if: ${{ inputs.format == 'sarif' && always() }}
        uses: github/codeql-action/upload-sarif@3c2c2e62e314c1db4b985d2d6d331bfddba70dde  # v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-${{ inputs.scan-type }}

      - name: Trivy summary
        if: always()
        env:
          # Env-isolate every caller-supplied input so the shell ${{ }}
          # substitution never appears inside `run:` blocks. CodeQL would
          # otherwise flag each occurrence as a code-injection vector
          # because the input value (controlled by the caller) would be
          # evaluated as a shell token. This pattern was established in
          # earlier sprints (see PRs that closed 33/55/105/107/132
          # code-injection alerts) and is required for any new workflow
          # that interpolates an input into a `run:` block.
          INPUTS_SCAN_TYPE: ${{ inputs.scan-type }}
          INPUTS_SCAN_REF: ${{ inputs.scan-ref }}
          INPUTS_IMAGE_REF: ${{ inputs.image-ref }}
          INPUTS_SEVERITY: ${{ inputs.severity }}
          INPUTS_FORMAT: ${{ inputs.format }}
          INPUTS_IGNORE_UNFIXED: ${{ inputs.ignore-unfixed }}
          INPUTS_TIMEOUT: ${{ inputs.timeout }}
          INPUTS_SCANNERS: ${{ inputs.scanners }}
        run: |
          {
            echo "## Trivy Scan - \`${INPUTS_SCAN_TYPE}\`"
            echo ""
            echo "| Field | Value |"
            echo "|:---|:---|"
            echo "| Scan type | \`${INPUTS_SCAN_TYPE}\` |"
            if [ "${INPUTS_SCAN_TYPE}" = "image" ]; then
              echo "| Image ref | \`${INPUTS_IMAGE_REF}\` |"
            else
              echo "| Scan ref | \`${INPUTS_SCAN_REF}\` |"
            fi
            echo "| Severity threshold | \`${INPUTS_SEVERITY}\` |"
            echo "| Format | \`${INPUTS_FORMAT}\` |"
            echo "| Scanners | \`${INPUTS_SCANNERS}\` |"
            echo "| Ignore unfixed | \`${INPUTS_IGNORE_UNFIXED}\` |"
            echo "| Timeout | \`${INPUTS_TIMEOUT}\` |"
          } >> "$GITHUB_STEP_SUMMARY"