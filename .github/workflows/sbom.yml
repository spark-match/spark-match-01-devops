# =============================================================================
# sbom.yml - Generate cyclonedx sbom and attach to GitHub Release
# =============================================================================
# NOTE: workflow_dispatch is declared below for manual re-runs of an
# existing release tag. Useful when a release was published before the
# sbom workflow existed (e.g. retroactively attaching sbom.cdx.json to
# v0.1.4). Required: workflow_dispatch with a `tag:` input that names
# the target release.
# Trigger:
#   - release { types: [published] }  : fires after release-please creates
#                                       a tagged release (this catalog
#                                       releases via release-please; see
#                                       .github/workflows/release-please.yml).
#   - workflow_dispatch               : manual re-run for an existing
#                                       release tag (input `tag:` is the
#                                       release tag, e.g. `v0.1.4`).
#
# Behavior:
#   1. Checkout the tagged commit.
#   2. Run anchore/sbom-action in `cyclonedx-json` format with
#      `upload-release-assets: false`. The action generates the sbom and
#      uploads it as a workflow artifact under the name `sbom.cdx.json`,
#      but does NOT push to the GitHub Release.
#   3. Download the workflow artifact to a stable local path.
#   4. Verify the sbom is valid cyclonedx JSON (`bomFormat == CycloneDX`,
#      `specVersion` present).
#   5. Upload the verified sbom to the GitHub Release via `gh release
#      upload`. This step is explicit, retry-friendly, and works in both
#      `release: published` and `workflow_dispatch` contexts.
#
# Why we replaced `upload-release-assets: true`:
#   anchore/sbom-action@v0.24.0 has a known regression where the
#   release-asset upload prints "Attaching SBOMs to release: <tag>"
#   but returns a non-zero exit code without producing the asset.
#   Re-running the same workflow via workflow_dispatch passes all
#   steps, but the asset is still missing from the release because
#   `upload-release-assets` is a no-op outside the `release: published`
#   context. Splitting the upload into an explicit `gh release upload`
#   step works around this and gives us retry-friendly logs.
#
# Why this exists:
#   - Compliance: SLSA Build Level 3 + supply-chain transparency
#     frameworks (US Executive Order 14028, EU Cyber Resilience Act)
#     require a machine-readable sbom for each release artifact.
#   - Downstream tooling: vulnerability scanners, license auditors, and
#     dependency-graph analyzers all consume cyclonedx.
#
# Cross-owner safe: uses default GITHUB_TOKEN; no caller secrets.
#
# Pin: anchore/sbom-action@v0.24.0
#   = v0.17.7. anchore/sbom-action is a maintained, widely-used sbom
#   generator that supports SPDX + cyclonedx. The cyclonedx-native
#   GitHub Action (CycloneDX/cyclonedx-action) was deprecated in 2024;
#   anchore's action is the recommended successor.
#
# History:
#   - PR-G4 (#186): initial sbom-release.yml
#   - rename (#188): sbom-release.yml -> sbom.yml
#   - fix-sbom-verify-step: add download-artifact before verify (closes
#     the false-positive "Process completed with exit code 1" on the
#     verify step; the action uploads the sbom as artifact but does NOT
#     place it in cwd by default). Discovered when v0.1.6 release ran.
#   - fix-sbom-release-upload: split sbom generation from release
#     upload. anchore/sbom-action@v0.24.0 has a regression where
#     `upload-release-assets: true` exits with a non-zero code while
#     printing "Attaching SBOMs to release: <tag>" without producing
#     the asset on the release. Workaround: set
#     `upload-release-assets: false` and call `gh release upload` in a
#     dedicated step. Discovered when v0.1.17 release ran (the sbom
#     was generated and stored as a workflow artifact but the release
#     had 0 assets).
# =============================================================================

name: sbom-release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach the sbom to (e.g. v0.1.4). Required only for manual runs.'
        type: string
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  # One sbom attach per release tag. Never cancel an in-flight upload
  # (could leave a half-attached asset).
  group: sbom-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  sbom:
    name: sbom-tag-${{ github.event.release.tag_name || inputs.tag || 'manual' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: checkout-release-commit
        uses: actions/checkout@v7
        with:
          # release:published event includes the tag's commit SHA; check
          # out that exact commit so the sbom matches what was released.
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: generate-cyclonedx-sbom
        uses: anchore/sbom-action@v0.24.2
        with:
          format: cyclonedx-json
          artifact-name: sbom.cdx.json
          # `upload-release-assets` is a known-flaky path in v0.24.0
          # (see header comment for details). We disable it here and
          # upload via `gh release upload` in the next step, which is
          # retry-friendly and works in both release + workflow_dispatch
          # contexts.
          upload-release-assets: false

      - name: download-sbom-artifact-for-verification
        # anchore/sbom-action uploads the sbom as a workflow artifact but
        # does NOT place it in the working directory by default. Pull it
        # back to a stable local path so the verify + upload steps can
        # operate on it.
        uses: actions/download-artifact@v8
        with:
          name: sbom.cdx.json
          path: ${{ runner.temp }}/sbom-download
        continue-on-error: false

      - name: verify-sbom-artifact-exists-and-is-valid-json
        env:
          SBOM_DIR: ${{ runner.temp }}/sbom-download
        run: |
          set -euo pipefail
          # Find the artifact (filename matches the artifact-name pattern).
          SBOM_PATH=$(find "${SBOM_DIR}" -type f -name 'sbom.cdx.json' | head -n1)
          if [ -z "${SBOM_PATH}" ] || [ ! -s "${SBOM_PATH}" ]; then
            echo "::error::sbom.cdx.json was not produced by anchore/sbom-action (searched ${SBOM_DIR})"
            exit 1
          fi
          # Validate JSON shape (must have a "bomFormat" field equal to "CycloneDX").
          BOM_FORMAT=$(jq -r '.bomFormat // ""' "${SBOM_PATH}")
          if [ "${BOM_FORMAT}" != "CycloneDX" ]; then
            echo "::error::${SBOM_PATH} is not a cyclonedx sbom (bomFormat=${BOM_FORMAT:-<missing>})"
            exit 1
          fi
          echo "cyclonedx sbom ok: $(wc -c < "${SBOM_PATH}") bytes, specVersion=$(jq -r '.specVersion' "${SBOM_PATH}")"

      - name: attach-sbom-to-release
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          SBOM_DIR: ${{ runner.temp }}/sbom-download
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # `gh release upload` requires the asset to exist on disk; we
        # downloaded it to SBOM_DIR in the previous step. The flag
        # `--clobber` overwrites a previous sbom.cdx.json if the same
        # tag has been processed twice (idempotent re-runs). We pin
        # `--repo` explicitly so the same workflow can be reused in
        # fork PRs without surprises.
        run: |
          set -euo pipefail
          if [ -z "${TAG}" ]; then
            echo "::error::no release tag resolved (neither release event nor inputs.tag set)"
            exit 1
          fi
          SBOM_PATH=$(find "${SBOM_DIR}" -type f -name 'sbom.cdx.json' | head -n1)
          if [ -z "${SBOM_PATH}" ]; then
            echo "::error::sbom.cdx.json missing in ${SBOM_DIR}; verify step must have failed silently"
            exit 1
          fi
          # `gh release upload` returns 0 even when the asset already
          # exists; combined with --clobber we get idempotent re-runs.
          # Retry on transient API failures (5xx) up to 3 times.
          attempt=1
          max_attempts=3
          until gh release upload "${TAG}" "${SBOM_PATH}" \
                  --repo "${{ github.repository }}" \
                  --clobber; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::error::gh release upload failed after ${max_attempts} attempts"
              exit 1
            fi
            attempt=$((attempt + 1))
            sleep "$((attempt * 5))"
          done
          echo "uploaded sbom.cdx.json to release ${TAG} (size=$(wc -c < "${SBOM_PATH}"))"

      - name: attach-summary
        if: always()
        run: |
          {
            echo "## sbom-release - \`${{ github.event.release.tag_name || inputs.tag || 'manual' }}\`"
            echo ""
            echo "| Field | Value |"
            echo "|:---|:---|"
            echo "| Tag | \`${{ github.event.release.tag_name || inputs.tag || '(none)' }}\` |"
            echo "| Format | \`cyclonedx-json\` |"
            echo "| Artifact | \`sbom.cdx.json\` |"
            echo "| Generator | \`anchore/sbom-action@v0.24.0\` |"
            echo "| Upload | \`gh release upload (explicit step)\` |"
          } >> "$GITHUB_STEP_SUMMARY"