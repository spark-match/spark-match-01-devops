name: node-build

on:
  workflow_call:
    inputs:
      environment-name:
        description: 'Target environment name (informational, used in job name and logs).'
        type: string
        required: false
        default: 'dev'
      node-version:
        description: 'Node.js version (passed to actions/setup-node).'
        type: string
        required: false
        default: '24'
      pkg-manager:
        description: 'JavaScript package manager (used for install + cache key). One of: npm, pnpm, yarn, bun.'
        type: string
        required: false
        default: 'npm'
      lockfile-name:
        description: 'Lockfile name relative to working-directory. Default "package-lock.json" (npm). Override for other managers.'
        type: string
        required: false
        default: 'package-lock.json'
      build-script:
        description: 'npm script that produces the build artifact (e.g. "build" running `ng build` for Angular or `vite build` for Vite).'
        type: string
        required: false
        default: 'build'
      pre-build-script:
        description: 'Optional npm script to run before the build (e.g. "prebuild" for Angular, "build:shared" for monorepos). Empty = skip.'
        type: string
        required: false
        default: ''
      working-directory:
        description: 'Working directory for npm (where the caller package.json lives). Default = repo root.'
        type: string
        required: false
        default: '.'

permissions:
  contents: read

jobs:
  build:
    name: "build-${{ inputs.environment-name }}"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
        shell: bash

    steps:
      - name: validate-inputs
        uses: spark-match/spark-match-01-devops/.github/actions/validate-workflow-inputs@main
        with:
          values: |
            {
              "pkg-manager": "${{ inputs.pkg-manager }}",
              "node-version": "${{ inputs.node-version }}",
              "lockfile-name": "${{ inputs.lockfile-name }}",
              "working-directory": "${{ inputs.working-directory }}"
            }
          enums: |
            {
              "pkg-manager": ["npm", "pnpm", "yarn", "bun"]
            }
          patterns: |
            {
              "node-version": "^[0-9]+(\\.[0-9]+){0,2}$",
              "lockfile-name": "^[A-Za-z0-9._\\-]+$"
            }

      - name: resolve-cache-key-tags
        run: |
          set -euo pipefail
          LOWER_OS="${RUNNER_OS,,}"
          ENV_NAME="${INPUTS_ENVIRONMENT_NAME,,}"
          case "$LOWER_OS" in
            linux|windows|macos) ;;
            *) echo "::error::Unsupported runner OS for cache key: '$RUNNER_OS'" >&2; exit 1 ;;
          esac
          case "$LOWER_OS:$INPUTS_PKG_MANAGER" in
            linux:npm)   CACHE_PATH="$HOME/.npm" ;;
            linux:pnpm)  CACHE_PATH="$HOME/.local/share/pnpm/store" ;;
            linux:yarn)  CACHE_PATH="$HOME/.cache/yarn" ;;
            linux:bun)   CACHE_PATH="$HOME/.bun/install/cache" ;;
            windows:npm) CACHE_PATH="$LOCALAPPDATA/npm-cache" ;;
            windows:pnpm) CACHE_PATH="$LOCALAPPDATA/pnpm/store" ;;
            windows:yarn) CACHE_PATH="$LOCALAPPDATA/Yarn/Cache" ;;
            windows:bun)  CACHE_PATH="$LOCALAPPDATA/bun/install/cache" ;;
            macos:npm)   CACHE_PATH="$HOME/.npm" ;;
            macos:pnpm)  CACHE_PATH="$HOME/Library/pnpm/store" ;;
            macos:yarn)  CACHE_PATH="$HOME/Library/Caches/Yarn" ;;
            macos:bun)   CACHE_PATH="$HOME/.bun/install/cache" ;;
            *) echo "::error::Unsupported runner OS / pkg-manager combo: '$RUNNER_OS/$INPUTS_PKG_MANAGER'" >&2; exit 1 ;;
          esac
          {
            echo "lower-os=$(printf '%s' "$LOWER_OS" | tr -d '\n\r')"
            echo "env-name=$(printf '%s' "$ENV_NAME" | tr -d '\n\r')"
            echo "cache-path=$(printf '%s' "$CACHE_PATH" | tr -d '\n\r')"
          } >> "$GITHUB_ENV"
          echo "Cache key segments: lower-os=$LOWER_OS node=${INPUTS_NODE_VERSION} pm=${INPUTS_PKG_MANAGER} env=$ENV_NAME"

        env:
          INPUTS_ENVIRONMENT_NAME: ${{ inputs.environment-name }}
          INPUTS_NODE_VERSION: ${{ inputs.node-version }}
          INPUTS_PKG_MANAGER: ${{ inputs.pkg-manager }}
      - name: checkout-caller-repository
        uses: actions/checkout@v7

      - name: setup-nodejs-${{ inputs.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          package-manager-cache: false

      - name: setup-pkg-manager
        run: |
          set -euo pipefail
          case "$INPUTS_PKG_MANAGER" in
            npm)
              PKG_INSTALL_CMD="npm ci"
              PKG_RUN_CMD="npm run"
              ;;
            pnpm)
              corepack enable
              corepack prepare pnpm@latest --activate
              PKG_INSTALL_CMD="pnpm install --frozen-lockfile"
              PKG_RUN_CMD="pnpm run"
              ;;
            yarn)
              corepack enable
              corepack prepare yarn@latest --activate
              YARN_VERSION="$(yarn --version)"
              case "$YARN_VERSION" in
                1.*) PKG_INSTALL_CMD="yarn install --frozen-lockfile" ;;
                *)   PKG_INSTALL_CMD="yarn install --immutable" ;;
              esac
              PKG_RUN_CMD="yarn run"
              ;;
            bun)
              PKG_INSTALL_CMD="bun install --frozen-lockfile"
              PKG_RUN_CMD="bun run"
              ;;
            *) echo "::error::Unsupported pkg-manager: '$INPUTS_PKG_MANAGER'" >&2; exit 1 ;;
          esac
          {
            echo "pkg-install-cmd=$PKG_INSTALL_CMD"
            echo "pkg-run-cmd=$PKG_RUN_CMD"
          } >> "$GITHUB_ENV"
        env:
          INPUTS_PKG_MANAGER: ${{ inputs.pkg-manager }}

      - name: setup-bun-runtime
        if: inputs.pkg-manager == 'bun'
        uses: oven-sh/setup-bun@v2

      - name: cache-${{ inputs.pkg-manager }}-dependencies
        uses: actions/cache@v6
        with:
          path: ${{ env.cache-path }}
          key: ${{ env.lower-os }}-node${{ inputs.node-version }}-${{ inputs.pkg-manager }}-${{ env.env-name }}-${{ hashFiles(format('{0}/{1}', inputs.working-directory, inputs.lockfile-name)) }}
          restore-keys: |
            ${{ env.lower-os }}-node${{ inputs.node-version }}-${{ inputs.pkg-manager }}-${{ env.env-name }}-

      - name: install-dependencies
        env:
          PKG_INSTALL_CMD: ${{ env.pkg-install-cmd }}
        run: ${PKG_INSTALL_CMD}

      - name: pre-build-hook
        if: inputs.pre-build-script != ''
        env:
          INPUTS_PRE_BUILD_SCRIPT: ${{ inputs.pre-build-script }}
          PKG_RUN_CMD: ${{ env.pkg-run-cmd }}
        run: ${PKG_RUN_CMD} "${INPUTS_PRE_BUILD_SCRIPT}"

      - name: run-build
        env:
          INPUTS_BUILD_SCRIPT: ${{ inputs.build-script }}
          PKG_RUN_CMD: ${{ env.pkg-run-cmd }}
        run: ${PKG_RUN_CMD} "${INPUTS_BUILD_SCRIPT}"
