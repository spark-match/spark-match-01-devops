# =============================================================================
# Reusable Workflow: Python CI (uv + ruff + mypy + pytest)
# =============================================================================
# Atomic recipe (python layer). Drives the canonical Python QA pipeline:
# ruff format + check, mypy strict, pytest with coverage gate (default 80%),
# bandit, pip-audit. Caller passes `commands` as a CSV to opt out of any
# step (e.g. drop security on internal-only libs).
#
# Caller expects a `pyproject.toml` at `working-directory` (default `.`).
# Optional `uv.lock` for reproducible installs.
#
# Coverage report is emitted as Cobertura XML at `coverage.xml` (downloaded
# as artifact `python-ci-coverage`). Pair with reusable-sonar-python.yml
# to upload it to sonar-cloud (or upload manually to Codecov).
#
# Pin: callers cross-repo usan `@main` per docs/VERSIONING.md.
# =============================================================================

name: reusable-python-ci

on:
  workflow_call:
    inputs:
      environment-name:
        description: 'Target environment identifier. Used in the job name.'
        type: string
        required: true
      working-directory:
        description: 'Directory containing pyproject.toml (and uv.lock if present).'
        type: string
        required: false
        default: '.'
      commands:
        description: |
          Ordered pipeline steps to run, CSV. Valid steps (subset, any order):
            format/lint:    lint:ruff-format, lint:ruff-format-fix, lint:ruff-check, lint:ruff-check-fix, lint:bandit
            types/tests:    typecheck:mypy, test:pytest
            security:       lock:check, security:pip-audit
            coverage:       coverage:report, coverage:upload
            escape hatch:   none (then only manual steps below this input run)
          Default: full QA pipeline (no security commands).
        type: string
        required: false
        default: 'lint:ruff-format,lint:ruff-check,typecheck:mypy,test:pytest,coverage:report,coverage:upload'
      dependency-groups:
        description: 'Extra `uv sync --group` groups (space-separated). For security commands add `security`.'
        type: string
        required: false
        default: 'dev'
      runs-on:
        description: 'Runner label. Override for windows/macos/arm64 callers.'
        type: string
        required: false
        default: 'ubuntu-latest'
      ruff-targets:
        description: 'Paths passed to `ruff format/check/fix`, separated by spaces or commas.'
        type: string
        required: false
        default: 'src tests'
      mypy-targets:
        description: 'Paths passed to `mypy`, separated by spaces or commas.'
        type: string
        required: false
        default: 'src'
      pytest-targets:
        description: 'Path passed to `pytest`.'
        type: string
        required: false
        default: 'tests'
      pytest-args:
        description: |
          Free-form args appended after `pytest --tb=short <pytest-targets>`.
          Caller-quoted: e.g. `'-n auto'` or `'-p no:cacheprovider --maxfail=1'`.
          For coverage, add `--cov=<pkg> --cov-report=xml:<coverage-output>` here.
        type: string
        required: false
        default: ''
      coverage-output:
        description: 'Coverage file path uploaded as an artifact (typically coverage.xml).'
        type: string
        required: false
        default: 'coverage.xml'
      coverage-threshold:
        description: 'Numeric threshold (e.g. "80" or "75.5") enforced via `coverage report --fail-under`. Empty disables. Requires `.coverage` to exist (caller must add `--cov` to pytest-args or use `coverage:report` step).'
        type: string
        required: false
        default: '80'
      permissions-write:
        description: 'Opt-in sticky PR coverage comment via marocchino/sticky-pull-request-comment. Off by default; on requires the caller repo to allow `pull-requests: write` on this workflow.'
        type: boolean
        required: false
        default: false
      lock-check:
        description: 'Run `uv lock --check` before sync (drift detector between pyproject.toml and uv.lock). Exits non-zero if the lockfile is out of date.'
        type: boolean
        required: false
        default: false
      sync-mode:
        description: |
          Sync scope for `uv sync`. Lets callers skip expensive dev/test groups for
          lint-only or runtime-only jobs.
            full          Install all groups listed in `dependency-groups` (default).
            runtime-only  `uv sync --no-dev`. Use for production-style jobs.
            lint-only     `uv sync --only-group lint`. Requires a `[dependency-groups]`
                          named `lint` in pyproject.toml.
        type: string
        required: false
        default: 'full'
      frozen:
        description: 'Pass `--frozen` to `uv sync` (no lock regeneration; prod callers). Mutually beneficial with `lock-check: true`.'
        type: boolean
        required: false
        default: false
      setup-uv-version:
        description: 'uv version to install via astral-sh/setup-uv.'
        type: string
        required: false
        default: 'latest'
      cache-suffix:
        description: 'Suffix appended to the GH Actions cache key for uv. Empty falls back to `environment-name`.'
        type: string
        required: false
        default: ''
      timeout-minutes:
        description: 'Job timeout in minutes.'
        type: number
        required: false
        default: 20
      fail-fast:
        description: 'strategy.matrix.fail-fast. When true, failure in one matrix leg cancels the others.'
        type: boolean
        required: false
        default: false
      python-version:
        description: 'Python version to install (matrix value). Override for multi-version testing.'
        type: string
        required: false
        default: '3.14'

permissions:
  contents: read
  pull-requests: write

jobs:
  qa:
    name: "python-ci-${{ inputs.environment-name }}"
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    strategy:
      fail-fast: ${{ inputs.fail-fast }}
      matrix:
        python-version: ["${{ inputs.python-version }}"]

    steps:
      - name: validate-inputs
        uses: spark-match/spark-match-01-devops/.github/actions/validate-workflow-inputs@main
        with:
          values: |
            {
              "environment-name": "${{ inputs.environment-name }}",
              "working-directory": "${{ inputs.working-directory }}",
              "runs-on": "${{ inputs.runs-on }}",
              "coverage-threshold": "${{ inputs.coverage-threshold }}",
              "sync-mode": "${{ inputs.sync-mode }}",
              "python-version": "${{ inputs.python-version }}"
            }
          required: environment-name|working-directory|runs-on|python-version
          enums: |
            {
              "sync-mode": ["full", "runtime-only", "lint-only"]
            }
          patterns: |
            {
              "coverage-threshold": "^$|^[0-9]+(\\.[0-9]+)?$",
              "python-version": "^[0-9]+(\\.[0-9]+)?(\\.[0-9]+)?$"
            }

      - name: validate-commands-token
        env:
          INPUTS_COMMANDS: ${{ inputs.commands }}
        run: |
          set -euo pipefail
          case "${INPUTS_COMMANDS}" in
            *security:pip-audit*|*lint:ruff-format-fix*|*lint:ruff-check-fix*|*lock:check*|*lint:bandit*|*lint:ruff-format*|*lint:ruff-check*|*typecheck:mypy*|*test:pytest*|*coverage:report*|*coverage:upload*|*none*) ;;
            *) echo "::error::commands: unknown pipeline step in '${INPUTS_COMMANDS}'. Valid steps: lint:ruff-format, lint:ruff-format-fix, lint:ruff-check, lint:ruff-check-fix, lock:check, typecheck:mypy, test:pytest, coverage:report, coverage:upload, security:pip-audit, lint:bandit, none."; exit 1 ;;
          esac
          echo "Commands token validated"

      - name: checkout-caller-repository
        uses: actions/checkout@v7

      - name: setup-uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ inputs.setup-uv-version }}
          enable-cache: true
          cache-suffix: ${{ inputs.cache-suffix }}
          cache-dependency-glob: |
            ${{ inputs.working-directory }}/pyproject.toml
            ${{ inputs.working-directory }}/uv.lock

      - name: setup-python-${{ inputs.python-version }}
        working-directory: ${{ inputs.working-directory }}
        env:
          MATRIX_PYTHON_VERSION: ${{ matrix.python-version }}
        run: uv python install "${MATRIX_PYTHON_VERSION}"

      - name: sync-dependencies
        working-directory: ${{ inputs.working-directory }}
        env:
          INPUTS_LOCK_CHECK: ${{ inputs.lock-check }}
          INPUTS_SYNC_MODE: ${{ inputs.sync-mode }}
          INPUTS_DEPENDENCY_GROUPS: ${{ inputs.dependency-groups }}
          INPUTS_FROZEN: ${{ inputs.frozen }}
        run: |
          set -euo pipefail
          if [ "${INPUTS_LOCK_CHECK}" = "true" ]; then
            echo "Running uv lock --check (input lock-check=true)"
            uv lock --check
          fi
          sync_args=()
          case "${INPUTS_SYNC_MODE}" in
            full)
              for g in ${INPUTS_DEPENDENCY_GROUPS}; do
                sync_args+=(--group "$g")
              done
              ;;
            runtime-only)
              sync_args+=(--no-dev)
              ;;
            lint-only)
              sync_args+=(--only-group lint)
              ;;
          esac
          if [ "${INPUTS_FROZEN}" = "true" ]; then
            sync_args+=("--frozen")
          fi
          if [ "${#sync_args[@]}" -eq 0 ]; then
            uv sync
          else
            uv sync "${sync_args[@]}"
          fi

      - name: lock-check
        if: ${{ contains(inputs.commands, 'lock:check') }}
        working-directory: ${{ inputs.working-directory }}
        run: uv lock --check

      # Los *-targets admiten varias rutas. Como los inputs no pueden
      # interpolarse dentro de un run:, llegan por variable de entorno, y
      # entrecomillarlas las pasaba como UN solo argumento: ruff recibia una
      # ruta literal "src tests evals" y moria con "No such file or directory".
      # Estaba roto incluso con el default del propio input ('src tests');
      # nadie lo habia notado porque ningun caller habia migrado todavia.
      # Se divide con IFS=', ' para aceptar tanto comas como espacios: la
      # descripcion del input decia CSV y el default usaba espacios.
      - name: lint-ruff-format
        if: ${{ contains(inputs.commands, 'lint:ruff-format') }}
        working-directory: ${{ inputs.working-directory }}
        env:
          INPUTS_RUFF_TARGETS: ${{ inputs.ruff-targets }}
        run: |
          IFS=', ' read -ra TARGETS <<< "${INPUTS_RUFF_TARGETS}"
          uv run ruff format --check "${TARGETS[@]}"

      - name: lint-ruff-format-fix
        if: ${{ contains(inputs.commands, 'lint:ruff-format-fix') }}
        working-directory: ${{ inputs.working-directory }}
        env:
          INPUTS_RUFF_TARGETS: ${{ inputs.ruff-targets }}
        run: |
          echo "::notice::Running 'ruff format' (mutates files; does not commit)"
          IFS=', ' read -ra TARGETS <<< "${INPUTS_RUFF_TARGETS}"
          uv run ruff format "${TARGETS[@]}"
          echo "::notice::Files modified; review the diff in PR or in Actions artifacts (uncommitted changes stay in the runner)."

      - name: lint-ruff-check
        if: ${{ contains(inputs.commands, 'lint:ruff-check') }}
        working-directory: ${{ inputs.working-directory }}
        env:
          INPUTS_RUFF_TARGETS: ${{ inputs.ruff-targets }}
        run: |
          IFS=', ' read -ra TARGETS <<< "${INPUTS_RUFF_TARGETS}"
          uv run ruff check "${TARGETS[@]}"

      - name: lint-ruff-check-fix
        if: ${{ contains(inputs.commands, 'lint:ruff-check-fix') }}
        working-directory: ${{ inputs.working-directory }}
        env:
          INPUTS_RUFF_TARGETS: ${{ inputs.ruff-targets }}
        run: |
          echo "::notice::Running 'ruff check --fix' (mutates files; does not commit)"
          IFS=', ' read -ra TARGETS <<< "${INPUTS_RUFF_TARGETS}"
          uv run ruff check --fix "${TARGETS[@]}"
          echo "::notice::Files modified; review the diff in PR or in Actions artifacts."

      - name: lint-bandit
        if: ${{ contains(inputs.commands, 'lint:bandit') }}
        working-directory: ${{ inputs.working-directory }}
        env:
          INPUTS_RUFF_TARGETS: ${{ inputs.ruff-targets }}
        run: |
          echo "::notice::Running bandit security linter"
          IFS=', ' read -ra TARGETS <<< "${INPUTS_RUFF_TARGETS}"
          uv run bandit --recursive "${TARGETS[@]}" --skip B101

      - name: typecheck-mypy
        if: ${{ contains(inputs.commands, 'typecheck:mypy') }}
        working-directory: ${{ inputs.working-directory }}
        env:
          INPUTS_MYPY_TARGETS: ${{ inputs.mypy-targets }}
        run: |
          IFS=', ' read -ra TARGETS <<< "${INPUTS_MYPY_TARGETS}"
          uv run mypy "${TARGETS[@]}"

      - name: test-pytest
        if: ${{ contains(inputs.commands, 'test:pytest') }}
        uses: spark-match/spark-match-01-devops/.github/actions/run-pytest-with-args@main
        with:
          pytest-targets: ${{ inputs.pytest-targets }}
          pytest-args: ${{ inputs.pytest-args }}
          working-directory: ${{ inputs.working-directory }}

      - name: coverage-report
        if: ${{ contains(inputs.commands, 'coverage:report') }}
        working-directory: ${{ inputs.working-directory }}
        env:
          INPUTS_COVERAGE_THRESHOLD: ${{ inputs.coverage-threshold }}
          INPUTS_COVERAGE_OUTPUT: ${{ inputs.coverage-output }}
        run: |
          set -euo pipefail
          echo "Enforcing coverage threshold >= ${INPUTS_COVERAGE_THRESHOLD}%"
          uv run coverage report --fail-under="${INPUTS_COVERAGE_THRESHOLD}"
          # Cobertura-style XML report at INPUTS_COVERAGE_OUTPUT for downstream
          # consumers (e.g. sonar-python reusable).
          uv run coverage xml -o "${INPUTS_COVERAGE_OUTPUT}"

      - name: coverage-upload
        if: ${{ always() && contains(inputs.commands, 'coverage:upload') }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-py${{ inputs.python-version }}
          path: ${{ inputs.working-directory }}/${{ inputs.coverage-output }}
          if-no-files-found: ignore

      - name: sticky-coverage-pr-comment
        if: ${{ always() && inputs.permissions-write && contains(inputs.commands, 'coverage:upload') }}
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: python-ci-coverage-${{ inputs.environment-name }}
          message: |
            ## Coverage report (Python CI `${{ inputs.environment-name }}`)
            | Field | Value |
            |:---|:---|
            | Working dir | `${{ inputs.working-directory }}` |
            | Python | ${{ inputs.python-version }} |
            | Threshold | `${{ inputs.coverage-threshold || 'not enforced' }}` |
            | Coverage file | `${{ inputs.coverage-output }}` |
            | Commit | `${{ github.sha }}` |

      - name: security-pip-audit
        if: ${{ contains(inputs.commands, 'security:pip-audit') }}
        working-directory: ${{ inputs.working-directory }}
        run: |
          echo "::notice::Running pip-audit (transitive deps, no autofix)"
          uv run pip-audit --skip-editable

      - name: summary
        if: always()
        env:
          INPUTS_ENVIRONMENT_NAME: ${{ inputs.environment-name }}
          MATRIX_PYTHON_VERSION: ${{ matrix.python-version }}
          INPUTS_RUNS_ON: ${{ inputs.runs-on }}
          INPUTS_WORKING_DIRECTORY: ${{ inputs.working-directory }}
          INPUTS_DEPENDENCY_GROUPS: ${{ inputs.dependency-groups }}
          INPUTS_CACHE_SUFFIX: ${{ inputs.cache-suffix || inputs.environment-name }}
          INPUTS_SYNC_MODE: ${{ inputs.sync-mode }}
          INPUTS_LOCK_CHECK: ${{ inputs.lock-check }}
          INPUTS_FROZEN: ${{ inputs.frozen }}
          INPUTS_TIMEOUT_MINUTES: ${{ inputs.timeout-minutes }}
          INPUTS_FAIL_FAST: ${{ inputs.fail-fast }}
          INPUTS_COVERAGE_THRESHOLD: ${{ inputs.coverage-threshold || 'not enforced' }}
          INPUTS_PERMISSIONS_WRITE: ${{ inputs.permissions-write }}
          INPUTS_PYTEST_ARGS: ${{ inputs.pytest-args || 'none' }}
          INPUTS_COMMANDS: ${{ inputs.commands }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          {
            echo "## Python CI - \`${INPUTS_ENVIRONMENT_NAME}\`"
            echo ""
            echo "| Field | Value |"
            echo "|:---|:---|"
            echo "| Environment | \`${INPUTS_ENVIRONMENT_NAME}\` |"
            echo "| Python version | \`${MATRIX_PYTHON_VERSION}\` |"
            echo "| Runs on | \`${INPUTS_RUNS_ON}\` |"
            echo "| Working directory | \`${INPUTS_WORKING_DIRECTORY}\` |"
            echo "| Dependency groups | \`${INPUTS_DEPENDENCY_GROUPS}\` |"
            echo "| Cache suffix | \`${INPUTS_CACHE_SUFFIX}\` |"
            echo "| Sync mode | \`${INPUTS_SYNC_MODE}\` |"
            echo "| Lock check | \`${INPUTS_LOCK_CHECK}\` |"
            echo "| Frozen | \`${INPUTS_FROZEN}\` |"
            echo "| Timeout (min) | \`${INPUTS_TIMEOUT_MINUTES}\` |"
            echo "| Fail-fast | \`${INPUTS_FAIL_FAST}\` |"
            echo "| Coverage threshold | \`${INPUTS_COVERAGE_THRESHOLD}\` |"
            echo "| Permissions (write) | \`${INPUTS_PERMISSIONS_WRITE}\` |"
            echo "| Pytest extra args | \`${INPUTS_PYTEST_ARGS}\` |"
            echo "| Pipeline steps | \`${INPUTS_COMMANDS}\` |"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo "| Triggered by | @${GITHUB_ACTOR} |"
          } >> "$GITHUB_STEP_SUMMARY"
