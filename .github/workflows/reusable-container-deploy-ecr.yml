# =============================================================================
# Reusable Workflow: Container Deploy (ECR push via OIDC)
# =============================================================================
# Atomic recipe (deploy layer). Builds a Dockerfile via `docker buildx`,
# pushes the resulting image to an Amazon ECR repository, and tags it
# `latest` + `<sha>` by default. Caller-supplies the ECR repository name
# (already provisioned via Terraform in spark-match-02-infrastructure) and
# the OIDC role ARN that has IAM permission to call `ecr:GetAuthorizationToken`
# + `ecr:BatchGetImage` + `ecr:PutImage` + `ecr:InitiateLayerUpload` +
# `ecr:UploadLayerPart` + `ecr:CompleteLayerUpload` + `sts:GetCallerIdentity`.
#
# The recipe assumes the caller has already created the ECR repository via
# Terraform. It does NOT create the repository itself.
#
# Pushing is only half of a deploy: the image sits in ECR until something puts
# it in front of traffic. That something is `reusable-ecs-deploy.yml`, which
# needs to be told WHICH image. Hence the `image-uri` output -- pinned by
# digest so the deploy job lands on the exact image this run built:
#
#   push:
#     uses: .../reusable-container-deploy-ecr.yml@main
#   roll:
#     needs: push
#     uses: .../reusable-ecs-deploy.yml@main
#     with:
#       image-uri: ${{ needs.push.outputs.image-uri }}
#
# Pin: callers cross-repo usan `@main` per docs/VERSIONING.md.
# =============================================================================

name: reusable-container-deploy-ecr

on:
  workflow_call:
    inputs:
      environment-name:
        description: 'Target GH Environment identifier (dev, prod, etc). Used as the GH Environment gate, job name.'
        type: string
        required: true
      aws-region:
        description: 'AWS region of the ECR repository.'
        type: string
        required: false
        default: 'us-east-1'
      ecr-repository:
        description: 'Name of the ECR repository (without registry prefix).'
        type: string
        required: true
      dockerfile-path:
        description: 'Path to the Dockerfile relative to repo root.'
        type: string
        required: false
        default: 'Dockerfile'
      context-path:
        description: 'Build context path relative to repo root.'
        type: string
        required: false
        default: '.'
      platforms:
        description: 'Comma-separated platforms to build (passed to docker buildx). Default linux/arm64 (Bedrock AgentCore contract); override for amd64.'
        type: string
        required: false
        default: 'linux/arm64'
      image-tags-input:
        description: 'Comma-separated tag list. Each tag is appended to `<registry>/<repo>:<tag>`. Default: `latest`, `<github.sha short>`.'
        type: string
        required: false
        default: 'latest,__GITHUB_SHA_SHORT__'
      cache-scope:
        description: 'GHA cache scope segment used for `cache-from type=gha,scope=<scope>`. Lets multiple recipes coexist on the same runner without cache poisoning.'
        type: string
        required: false
        default: 'container-dev'
      provenance:
        description: 'Set `provenance: true` on `docker build-push-action` (default true for SLSA Build Level 3 provenance attestation).'
        type: boolean
        required: false
        default: true
      sbom:
        description: 'Set `sbom: true` on `docker build-push-action` (default true; emits an SPDX SBOM attestation alongside the provenance).'
        type: boolean
        required: false
        default: true
      cosign-sign:
        description: 'Sign every pushed tag with Sigstore cosign (keyless via GitHub OIDC + Fulcio). Default false (opt-in). Requires `id-token: write` which this workflow already declares.'
        type: boolean
        required: false
        default: false
      extra-buildx-args:
        description: 'Reserved for caller-side raw passthrough. Not used in v1; do not set.'
        type: string
        required: false
        default: ''
      deploy-role-arn:
        description: 'OIDC role ARN passed directly as a string input. Preferred over `deploy-role-arn-secret` to avoid GitHub secret masking for cross-owner calls. Identifiers are not credentials.'
        type: string
        required: false
        default: ''
      deploy-role-arn-secret:
        description: 'Name of the GitHub Secret holding the OIDC role ARN for deploy (e.g. AWS_DEPLOY_ROLE_ARN_DEV). Used as fallback when `deploy-role-arn` is empty.'
        type: string
        required: false
        default: 'AWS_DEPLOY_ROLE_ARN'
    secrets:
      AWS_DEPLOY_ROLE_ARN:
        description: 'OIDC role ARN for the deploy job. Caller passes this explicitly (cross-owner inheritance is blocked by GitHub for cross-owner calls). Optional when caller passes `deploy-role-arn` string input instead.'
        required: false
    outputs:
      image-uri:
        description: 'Image URI pinned by digest (`<registry>/<repo>@sha256:...`). This is what you feed to `reusable-ecs-deploy.yml`: a digest is immutable, so the revision ECS registers is the exact image this run built, not whatever `latest` points at by the time the deploy step runs.'
        value: ${{ jobs.deploy.outputs.image-uri }}
      image-digest:
        description: 'Bare `sha256:...` digest of the pushed image (manifest index when the build is multi-platform).'
        value: ${{ jobs.deploy.outputs.image-digest }}
      image-tags:
        description: 'Comma-separated list of every fully-qualified tag pushed, as resolved from `image-tags-input`.'
        value: ${{ jobs.deploy.outputs.image-tags }}
      registry:
        description: 'ECR registry host (`<account-id>.dkr.ecr.<region>.amazonaws.com`), resolved from the OIDC identity.'
        value: ${{ jobs.deploy.outputs.registry }}

permissions:
  id-token: write
  contents: read
  # Requerido por el step `notify-deploy-failure` (sticky PR comment). Sin
  # esto la unica senal de un push fallido moria con un 403 y el job
  # terminaba en rojo por el comentario, no por el deploy.
  pull-requests: write

jobs:
  deploy:
    name: "container-deploy-ecr-${{ inputs.environment-name }}"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: ${{ inputs.environment-name }}
    outputs:
      image-uri: ${{ steps.image.outputs.image-uri }}
      image-digest: ${{ steps.build.outputs.digest }}
      image-tags: ${{ steps.tags.outputs.tags }}
      registry: ${{ steps.registry.outputs.registry }}
    steps:
      - name: validate-inputs
        uses: spark-match/spark-match-01-devops/.github/actions/validate-workflow-inputs@main
        with:
          values: |
            {
              "environment-name": "${{ inputs.environment-name }}",
              "ecr-repository": "${{ inputs.ecr-repository }}",
              "dockerfile-path": "${{ inputs.dockerfile-path }}",
              "context-path": "${{ inputs.context-path }}",
              "platforms": "${{ inputs.platforms }}"
            }
          required: environment-name|ecr-repository|dockerfile-path|context-path|platforms
          patterns: |
            {
              "ecr-repository": "^[a-z0-9][a-z0-9_-]{0,254}$",
              "platforms": "^[a-z0-9/]+(,[a-z0-9/]+)*$"
            }

      - name: checkout-caller-repository
        uses: actions/checkout@v7

      - name: configure-aws-credentials-oidc-deploy-role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ inputs.deploy-role-arn != '' && inputs.deploy-role-arn || secrets[inputs.deploy-role-arn-secret] }}
          aws-region: ${{ inputs.aws-region }}

      - name: verify-sts-identity
        env:
          INPUTS_AWS_REGION: ${{ inputs.aws-region }}
        run: |
          set -euo pipefail
          ACCOUNT="$(aws sts get-caller-identity --query 'Account' --output text)"
          echo "Authenticated as AWS account: ${ACCOUNT} (region: ${INPUTS_AWS_REGION})"

      - name: login-ecr
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registries: ${{ inputs.aws-region == 'aws-cn' && 'aws' || '' }}

      - name: resolve-ecr-registry
        id: registry
        env:
          INPUTS_AWS_REGION: ${{ inputs.aws-region }}
        run: |
          set -euo pipefail
          REGISTRY="${AWS_ACCOUNT_ID:-$(aws sts get-caller-identity --query 'Account' --output text)}.dkr.ecr.${INPUTS_AWS_REGION}.amazonaws.com"
          echo "registry=${REGISTRY}" >> "${GITHUB_OUTPUT}"
          echo "ECR registry: ${REGISTRY}"

      - name: setup-docker-buildx
        uses: docker/setup-buildx-action@v4

      - name: compute-image-tags
        id: tags
        env:
          INPUTS_ECR_REPOSITORY: ${{ inputs.ecr-repository }}
          INPUTS_IMAGE_TAGS_INPUT: ${{ inputs.image-tags-input }}
          STEPS_REGISTRY_OUTPUTS_REGISTRY: ${{ steps.registry.outputs.registry }}
        run: |
          set -euo pipefail
          SHA_SHORT="${GITHUB_SHA::7}"
          REGISTRY="${STEPS_REGISTRY_OUTPUTS_REGISTRY}"
          REPO="${INPUTS_ECR_REPOSITORY}"
          RAW="${INPUTS_IMAGE_TAGS_INPUT}"
          # Allow the caller to encode the short SHA with __GITHUB_SHA_SHORT__
          # (escaped so it survives YAML interpolation).
          RAW="${RAW//__GITHUB_SHA_SHORT__/${SHA_SHORT}}"

          TAGS=""
          IFS=',' read -ra WANTED <<< "$RAW"
          for RAW_TAG in "${WANTED[@]}"; do
            TAG_TRIM="$(echo -n "$RAW_TAG" | xargs)"
            [ -z "$TAG_TRIM" ] && continue
            TAGS="${TAGS:+${TAGS},}${REGISTRY}/${REPO}:${TAG_TRIM}"
          done
          if [ -z "$TAGS" ]; then
            echo "::error::image-tags-input resolved to empty tag list"
            exit 1
          fi
          echo "tags=${TAGS}" >> "${GITHUB_OUTPUT}"
          echo "Will push tags: ${TAGS}"

      - name: build-and-push-image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context-path }}
          file: ${{ inputs.dockerfile-path }}
          push: true
          platforms: ${{ inputs.platforms }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=${{ inputs.cache-scope }}
          cache-to: type=gha,scope=${{ inputs.cache-scope }},mode=max
          provenance: ${{ inputs.provenance }}
          sbom: ${{ inputs.sbom }}

      - name: resolve-image-uri
        id: image
        env:
          INPUTS_ECR_REPOSITORY: ${{ inputs.ecr-repository }}
          STEPS_REGISTRY_OUTPUTS_REGISTRY: ${{ steps.registry.outputs.registry }}
          STEPS_BUILD_OUTPUTS_DIGEST: ${{ steps.build.outputs.digest }}
          STEPS_TAGS_OUTPUTS_TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          set -euo pipefail

          # Deploy layers downstream (reusable-ecs-deploy.yml) need a single
          # unambiguous reference to what this run just pushed. A tag is not
          # that: `latest` is mutable, so a deploy that resolves it later can
          # land on a different image than the one built here. The digest is.
          DIGEST="${STEPS_BUILD_OUTPUTS_DIGEST}"
          if [ -n "${DIGEST}" ]; then
            IMAGE_URI="${STEPS_REGISTRY_OUTPUTS_REGISTRY}/${INPUTS_ECR_REPOSITORY}@${DIGEST}"
          else
            # The image is already in ECR at this point -- failing here would
            # reject a push that actually succeeded. Fall back to the first tag
            # and make the loss of immutability loud instead.
            IMAGE_URI="${STEPS_TAGS_OUTPUTS_TAGS%%,*}"
            echo "::warning::docker/build-push-action returned no digest; falling back to the mutable tag ${IMAGE_URI}. Any downstream deploy resolves that tag at ITS run time, not this one."
          fi

          echo "image-uri=${IMAGE_URI}" >> "${GITHUB_OUTPUT}"
          echo "Image URI: ${IMAGE_URI}"

      - name: install-cosign
        if: ${{ inputs.cosign-sign }}
        uses: sigstore/cosign-installer@v3

      - name: sign-image-cosign-keyless
        if: ${{ inputs.cosign-sign }}
        env:
          INPUTS_IMAGE_TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          set -euo pipefail
          # Keyless signing via Sigstore Fulcio. The OIDC token comes from
          # the GHA runner (requires id-token: write, already declared at
          # workflow level). We sign each tag so consumers can verify any
          # of them independently.
          IFS=',' read -ra TAGS <<< "${INPUTS_IMAGE_TAGS}"
          for TAG in "${TAGS[@]}"; do
            echo "::group::cosign sign ${TAG}"
            cosign sign --yes "${TAG}"
            echo "::endgroup::"
          done

      - name: summary
        if: always()
        env:
          INPUTS_ENVIRONMENT_NAME: ${{ inputs.environment-name }}
          INPUTS_AWS_REGION: ${{ inputs.aws-region }}
          INPUTS_ECR_REPOSITORY: ${{ inputs.ecr-repository }}
          INPUTS_DOCKERFILE_PATH: ${{ inputs.dockerfile-path }}
          INPUTS_CONTEXT_PATH: ${{ inputs.context-path }}
          INPUTS_PLATFORMS: ${{ inputs.platforms }}
          INPUTS_CACHE_SCOPE: ${{ inputs.cache-scope }}
          INPUTS_PROVENANCE: ${{ inputs.provenance }}
          INPUTS_SBOM: ${{ inputs.sbom }}
          INPUTS_COSIGN_SIGN: ${{ inputs.cosign-sign }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_ACTOR: ${{ github.actor }}
          STEPS_TAGS_OUTPUTS_TAGS: ${{ steps.tags.outputs.tags }}
          STEPS_IMAGE_OUTPUTS_IMAGE_URI: ${{ steps.image.outputs.image-uri }}
        run: |
          {
            echo "## Container Deploy (ECR) - \`${INPUTS_ENVIRONMENT_NAME}\`"
            echo ""
            echo "| Field | Value |"
            echo "|:---|:---|"
            echo "| Environment | \`${INPUTS_ENVIRONMENT_NAME}\` |"
            echo "| AWS region | \`${INPUTS_AWS_REGION}\` |"
            echo "| ECR repository | \`${INPUTS_ECR_REPOSITORY}\` |"
            echo "| Dockerfile | \`${INPUTS_DOCKERFILE_PATH}\` |"
            echo "| Build context | \`${INPUTS_CONTEXT_PATH}\` |"
            echo "| Platforms | \`${INPUTS_PLATFORMS}\` |"
            echo "| Image tags | \`${STEPS_TAGS_OUTPUTS_TAGS}\` |"
            echo "| Image URI (digest) | \`${STEPS_IMAGE_OUTPUTS_IMAGE_URI}\` |"
            echo "| Cache scope | \`${INPUTS_CACHE_SCOPE}\` |"
            echo "| Provenance (SLSA) | \`${INPUTS_PROVENANCE}\` |"
            echo "| SBOM (SPDX) | \`${INPUTS_SBOM}\` |"
            echo "| Cosign sign | \`${INPUTS_COSIGN_SIGN}\` |"
            echo ""
            echo "Commit: \`${GITHUB_SHA}\`"
            echo "Triggered by: @${GITHUB_ACTOR}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: notify-deploy-failure
        # Solo tiene sentido en contexto de PR: en un push a dev/main no hay
        # PR donde dejar el comentario y la action fallaria por eso, no por
        # el deploy.
        if: ${{ failure() && github.event_name == 'pull_request' }}
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: container-deploy-ecr-failed-${{ inputs.environment-name }}
          message: |
            ## Container Deploy (ECR) Failed - `${{ inputs.environment-name }}`

            ECR repository: `${{ inputs.ecr-repository }}`
            Image tags attempted: `${{ steps.tags.outputs.tags }}`
            Commit: `${{ github.sha }}`
            Author: @${{ github.actor }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Please investigate. Layer uploads may be partially complete.
