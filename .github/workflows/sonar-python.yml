name: SonarCloud - Python

on:
  workflow_call:
    inputs:
      project-key:
        description: 'SonarCloud project key'
        type: string
        required: true
      project-name:
        description: 'SonarCloud project display name'
        type: string
        required: true
      organization:
        description: 'SonarCloud organization key'
        type: string
        required: true
      sources:
        description: 'Comma-separated source paths (relative to working-directory)'
        type: string
        required: true
      tests:
        description: 'Comma-separated test paths (relative to working-directory). Empty disables test analysis.'
        type: string
        required: true
      working-directory:
        description: 'Directory containing pyproject.toml and source code'
        type: string
        required: true
      env:
        description: 'Environment identifier (used in job name and logs)'
        type: string
        required: true
      python-version:
        description: 'Python version to install via uv'
        type: string
        required: true
      sync-groups:
        description: 'Space-separated dependency groups for uv sync (e.g. "dev test")'
        type: string
        required: true
      pytest-targets:
        description: 'Path passed to pytest'
        type: string
        required: true
      pytest-args:
        description: 'Extra pytest args (e.g. "--cov=src --cov-report=xml:coverage.xml")'
        type: string
        required: true
      coverage-paths:
        description: 'Comma-separated coverage report paths for SonarCloud'
        type: string
        required: true
      fail-on-quality-gate:
        description: 'Fail the job if the quality gate status is ERROR ("true" or "false")'
        type: string
        required: true
    secrets:
      SONAR_TOKEN:
        description: 'SonarCloud authentication token. Caller passes this explicitly (cross-owner inheritance is blocked by GitHub for cross-owner calls).'
        required: true

permissions:
  contents: read

concurrency:
  group: sonar-python-${{ inputs.env }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonar:
    name: "SonarCloud Python (${{ inputs.env }})"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}

    steps:
      - name: Validate inputs
        uses: spark-match/spark-match-01-devops/.github/actions/validate-workflow-inputs@d8b128c31046b475be607d6e04daa281590ac3cc  # main
        with:
          values: |
            {
              "project-key": "${{ inputs.project-key }}",
              "project-name": "${{ inputs.project-name }}",
              "organization": "${{ inputs.organization }}",
              "sources": "${{ inputs.sources }}",
              "tests": "${{ inputs.tests }}",
              "working-directory": "${{ inputs.working-directory }}",
              "env": "${{ inputs.env }}",
              "python-version": "${{ inputs.python-version }}",
              "sync-groups": "${{ inputs.sync-groups }}",
              "pytest-targets": "${{ inputs.pytest-targets }}",
              "pytest-args": "${{ inputs.pytest-args }}",
              "coverage-paths": "${{ inputs.coverage-paths }}",
              "fail-on-quality-gate": "${{ inputs.fail-on-quality-gate }}"
            }
          required: project-key|project-name|organization|sources|tests|working-directory|env|python-version|sync-groups|pytest-targets|pytest-args|coverage-paths|fail-on-quality-gate
          patterns: |
            {
              "python-version": "^[0-9]+\\.[0-9]+"
            }

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          version: 'latest'
          enable-cache: true
          cache-dependency-glob: |
            ${{ inputs.working-directory }}/pyproject.toml
            ${{ inputs.working-directory }}/uv.lock

      - name: Set up Python ${{ inputs.python-version }}
        run: uv python install "${INPUTS_PYTHON_VERSION}"

        env:
          INPUTS_PYTHON_VERSION: ${{ inputs.python-version }}
      - name: Sync dependencies
        run: |
          set -euo pipefail
          args=()
          for g in ${INPUTS_SYNC_GROUPS}; do
            args+=(--group "$g")
          done
          if [ "${#args[@]}" -eq 0 ]; then
            uv sync
          else
            uv sync "${args[@]}"
          fi

        env:
          INPUTS_SYNC_GROUPS: ${{ inputs.sync-groups }}
      - name: Run tests with coverage
        uses: spark-match/spark-match-01-devops/.github/actions/run-pytest-with-args@d8b128c31046b475be607d6e04daa281590ac3cc  # main
        with:
          pytest-targets: ${{ inputs.pytest-targets }}
          pytest-args: ${{ inputs.pytest-args }}
          working-directory: ${{ inputs.working-directory }}

      - name: Cache Sonar tools (scanner, GPG keys, embedded runtime)
        uses: actions/cache@v6
        with:
          path: ~/.sonar
          key: sonar-tools-v8.2.1-${{ runner.os }}
          restore-keys: |
            sonar-tools-v8.2.1-${{ runner.os }}

      - name: SonarCloud Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        uses: sonarsource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f  # v8.2.1
        with:
          projectBaseDir: ${{ inputs.working-directory }}
          args: >
            -Dsonar.projectKey=${{ inputs.project-key }}
            -Dsonar.organization=${{ inputs.organization }}
            -Dsonar.sources=${{ inputs.sources }}
            -Dsonar.tests=${{ inputs.tests }}
            -Dsonar.python.coverage.reportPaths=${{ inputs.coverage-paths }}
            -Dsonar.architecture.sensor.skip=true
            -Dsonar.scanner.dumpToFile=true

      - name: SonarCloud Quality Gate
        id: qg
        if: ${{ always() }}
        continue-on-error: true
        uses: sonarsource/sonarqube-quality-gate-action@cf038b0e0cdecfa9e56c198bbb7d21d751d62c3b  # v1.2.0
        timeout-minutes: 5
        with:
          pollingTimeoutSec: 300
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

      - name: Enforce Quality Gate
        if: ${{ always() && (steps.qg.outputs.quality-gate-status == 'FAILED' || (steps.qg.outcome == 'failure' && steps.qg.outputs.quality-gate-status == '')) && inputs.fail-on-quality-gate == 'true' }}
        run: |
          if [ -z "${STEPS_QG_OUTPUTS_QUALITY_GATE_STATUS}" ]; then
            echo "::error::SonarCloud Quality Gate polling timed out (>300s). SonarCloud may be under maintenance (https://status.sonarcloud.io). Re-run when service is healthy."
          else
            echo "::error::Quality Gate FAILED and fail-on-quality-gate=true"
          fi
          exit 1
        env:
          STEPS_QG_OUTPUTS_QUALITY_GATE_STATUS: ${{ steps.qg.outputs.quality-gate-status }}
