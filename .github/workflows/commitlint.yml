# =============================================================================
# Reusable Workflow: commitlint - enforce Conventional Commits on PRs
# =============================================================================
# Runs commitlint against every commit in a PR (and direct push to main)
# using .commitlintrc.json at repo root.
#
# Tool: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed (v6.2.1)
#   - Brings its own Node runtime in the GH Actions container; no Node
#     required locally.
#   - Reads .commitlintrc.json (or commitlint.config.mjs) from repo root.
#   - Fails the check if any commit message does not match the rules.
#
# Why a CI check (not just a local hook):
#   - Catches squash-merged commits whose messages were rewritten
#     in the merge form.
#   - Catches rebase-merged commits.
#   - Enforces the discipline uniformly regardless of the contributor's
#     local environment.
#
# Local pre-commit equivalent (no Node required): .githooks/commit-msg
# =============================================================================

name: commitlint

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: commitlint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-commits:
    name: "commitlint (env=${{ github.event.pull_request.head.ref || github.ref_name }})"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history required to lint every commit in the push/PR

      - name: Run commitlint
        uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed  # v6.2.1
        with:
          # Default config-file name is commitlint.config.mjs; we pin explicitly
          # to .commitlintrc.json for clarity (and so the action does not pick
          # up a stray commitlint.config.* if one is added later).
          configFile: .commitlintrc.json
          # Fail the run on any rule violation in any commit.
          failOnErrors: true
