name: commitlint

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: commitlint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-commits:
    uses: ./.github/workflows/reusable-commitlint.yml
    with:
      config-file: .commitlintrc.json
      help-url: "https://github.com/spark-match/spark-match-01-devops/blob/main/AGENTS.md"
      skip-release-please: true
