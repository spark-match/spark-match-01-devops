name: continuous-integration

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/**'
      - '**.yml'
      - '**.yaml'
      - '**.md'
      - 'scripts/**'
      - 'tests/**'
      - 'governance/**'
      - '.shellcheckrc'
  push:
    branches: [main]

permissions:
  contents: read
  # Lo pide reusable-trivy.yml a nivel de workflow. Un reusable no puede
  # escalar por encima del caller: sin esto, el job de trivy ni arranca.
  security-events: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job 1: Action Lint
  actionlint:
    name: actionlint
    uses: ./.github/workflows/reusable-actionlint.yml
    with:
      environment-name: ci
  # Job 2: Git Leaks (Secret Scanning)
  gitleaks:
    name: gitleaks
    uses: ./.github/workflows/reusable-gitleaks.yml
    with:
      environment-name: ci
    secrets:
      GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
  # Job 3: YAML Lint
  yamllint:
    name: yamllint
    uses: ./.github/workflows/reusable-yamllint.yml
    with:
      environment-name: ci
  # Job 4: Quality
  quality:
    name: quality
    uses: ./.github/workflows/reusable-quality.yml
    with:
      environment-name: ci
      shellcheck-severity: warning
      schema-strict: false
  # Job 5: Trivy
  #
  # Esta aqui sobre todo para EJERCER la receta, no porque este repo tenga
  # dependencias que escanear: son workflows YAML y scripts bash.
  #
  # reusable-trivy.yml se restauro el 2026-08-04 (PR #297) con el pin
  # `aquasecurity/trivy-action@0.36.0`, que no existe -- los tags de ese
  # repositorio llevan prefijo `v`. Estuvo roto desde el primer dia y nadie se
  # entero, porque no tenia ni un consumidor en toda la organizacion: cero runs
  # historicos. Lo destapo el primer repo que intento usarla
  # (spark-match-08-deep-agent, PR #65).
  #
  # El README dice que ci.yml existe para que "una receta rota se detecte aqui
  # antes de que rompa a los consumidores". Eso solo funciona con las recetas
  # que ci.yml realmente invoca. Esta faltaba.
  trivy:
    name: trivy
    uses: ./.github/workflows/reusable-trivy.yml
    with:
      scan-type: fs
      scan-ref: .
      scanners: vuln,misconfig
      severity: CRITICAL,HIGH
      ignore-unfixed: true
      format: table
