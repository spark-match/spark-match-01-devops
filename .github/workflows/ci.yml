name: continuous-integration

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/**'
      - '**.yml'
      - '**.yaml'
      - '**.md'
      - 'scripts/**'
      - 'tests/**'
      - 'governance/**'
      - '.shellcheckrc'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job 1: Action Lint
  actionlint:
    name: actionlint
    uses: ./.github/workflows/reusable-actionlint.yml
    with:
      environment-name: ci
  # Job 2: Git Leaks (Secret Scanning)
  gitleaks:
    name: gitleaks
    uses: ./.github/workflows/reusable-gitleaks.yml
    with:
      environment-name: ci
    secrets:
      GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
  # Job 3: YAML Lint
  yamllint:
    name: yamllint
    uses: ./.github/workflows/reusable-yamllint.yml
    with:
      environment-name: ci
  # Job 4: Quality
  quality:
    name: quality
    uses: ./.github/workflows/reusable-quality.yml
    with:
      environment-name: ci
      shellcheck-severity: warning
      schema-strict: false
