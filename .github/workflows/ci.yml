# =============================================================================
# CI - Lint & Security for spark-match-01-devops
# =============================================================================
# Trigger:
#   - pull_request: opened, synchronized or reopened targeting 'main',
#                   gated by the path filter (lint only what changed).
#   - push: any direct push to 'main' (including admin-bypass force
#           pushes), no path filter. Guarantees the ruleset's
#           strict_required_status_checks_policy is satisfied at every commit
#           on the protected branch. Runs in parallel with any active PR run;
#           concurrency: cancel-in-progress: true keeps the active one.
#
# Action: Run the atomic ecosystem recipes (actionlint, gitleaks, yamllint)
#         against this repository so a broken recipe is caught here before
#         consumers (orion-backend, orion-infrastructure, orion-cognitive-
#         agent, etc.) get a bad reference. Python/node/deploy recipes are
#         validated directly by caller repos on their own PRs (see
#         `docs/VERSIONING.md` § strategy).
#
# Each job calls the corresponding reusable workflow via a local path
# (`./.github/workflows/<name>.yml`). When merged, the same recipes become
# available to external repos via
#   spark-match/spark-match-01-devops/.github/workflows/<name>.yml@main
#
# Other layers (node/eslint, deploy/terraform-*) are NOT exercised here
# since the devops repo itself has no Node project or Terraform module to
# lint. They are validated directly by the consumer repos.
# =============================================================================

name: CI - Lint & Security

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      # Workflow files, composite actions, CODEOWNERS, dependabot config.
      - '.github/**'
      # Workflow-adjacent YAML/JSON anywhere in the tree (e.g.
      # governance/repository-governance.json, examples/*/workflow.yml).
      - '**.yml'
      - '**.yaml'
      - '**.md'
      # Bash + Python scripts under scripts/ — must run shellcheck.
      - 'scripts/**'
      # bats + pytest suites — must run the test jobs.
      - 'tests/**'
      # Governance manifest + schema — must run shellcheck + jq
      # validation (consumed by configure-repo-rulesets.sh).
      - 'governance/**'
      # .shellcheckrc is not a .yml — explicit entry so that a tweak
      # to the shellcheck configuration re-runs the shellcheck job.
      - '.shellcheckrc'
  push:
    branches: [main]            # no paths filter — strict mode requires checks on every commit

permissions:
  contents: read

# Cancel in-progress runs for the same PR + branch. Saves runner minutes on
# rapid pushes. The cancel-in-progress: true is safe for lint jobs (idempotent).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: actionlint
    uses: ./.github/workflows/actionlint.yml
    with:
      environment-name: ci

  gitleaks:
    name: gitleaks
    uses: ./.github/workflows/gitleaks.yml
    with:
      environment-name: ci
    secrets:
      GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  yamllint:
    name: yamllint
    uses: ./.github/workflows/yamllint.yml
    with:
      environment-name: ci

  quality:
    name: quality
    uses: ./.github/workflows/quality.yml
    with:
      environment-name: ci
      shellcheck-severity: warning
      schema-strict: false
