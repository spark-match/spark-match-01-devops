# =============================================================================
# Reusable Workflow: latex-build
# =============================================================================
# Compiles a latex document (typically an academic paper or report) and
# uploads the resulting PDF as an artifact.
#
# USAGE (in caller repo):
#   jobs:
#     build:
#       uses: spark-match/spark-match-01-devops/.github/workflows/reusable-latex-build.yml@main
#       with:
#         root-file: main.tex
#         artifact-name: spark-match-paper-pr-${{ github.event.pull_request.number }}
#
# Recommended trigger: on pull_request in caller workflow file.
# =============================================================================

name: latex-build

on:
  workflow_call:
    inputs:
      root-file:
        description: 'latex root file to compile (e.g. main.tex, paper.tex).'
        type: string
        required: false
        default: 'main.tex'
      artifact-name:
        description: 'Name for the uploaded PDF artifact.'
        type: string
        required: false
        default: 'latex-build'
      retention-days:
        description: 'Days to keep the artifact before deletion.'
        type: number
        required: false
        default: 14
      use-lualatex:
        description: 'Use lualatex instead of pdflatex (default pdflatex).'
        type: boolean
        required: false
        default: false
      shell-escape:
        description: 'Enable latex shell-escape (needed for some packages, security risk).'
        type: boolean
        required: false
        default: false
    outputs:
      artifact-name:
        description: 'Name of the uploaded artifact.'
        value: ${{ jobs.build.outputs.artifact-name }}

permissions:
  contents: read

# Cancel in-progress builds for the same caller + artifact name. Avoids
# wasting runner minutes if a PR is pushed multiple times in quick succession.
concurrency:
  group: latex-build-${{ inputs.artifact-name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: compile-latex
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      artifact-name: ${{ inputs.artifact-name }}
    steps:
      - name: checkout-caller-repository
        uses: actions/checkout@v7

      - name: compile-latex-document
        uses: xu-cheng/latex-action@v4
        with:
          root_file: ${{ inputs.root-file }}
          latexmk_use_lualatex: ${{ inputs.use-lualatex }}
          latexmk_shell_escape: ${{ inputs.shell-escape }}

      - name: determine-pdf-output-filename
        id: pdf
        run: |
          BASENAME="${INPUTS_ROOT_FILE%.tex}"
          echo "filename=${BASENAME}.pdf" >> "$GITHUB_OUTPUT"

        env:
          INPUTS_ROOT_FILE: ${{ inputs.root-file }}
      - name: upload-pdf-as-artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ steps.pdf.outputs.filename }}
          retention-days: ${{ inputs.retention-days }}
          if-no-files-found: error
