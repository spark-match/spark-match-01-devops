name: gitleaks

on:
  workflow_call:
    inputs:
      environment-name:
        description: 'Target environment name (informational, used in job name and logs).'
        type: string
        required: false
        default: 'dev'
    secrets:
      GITLEAKS_LICENSE:
        description: 'Gitleaks license key. Required for organization-scoped repos under gitleaks-action v3+. The caller must forward this secret explicitly because GitHub drops secrets inherit cross-owner.'
        required: true

permissions:
  contents: read

jobs:
  gitleaks:
    name: "gitleaks (${{ inputs.environment-name }})"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate Inputs
        uses: spark-match/spark-match-01-devops/.github/actions/validate-workflow-inputs@main
        with:
          values: |
            {"environment-name": "${{ inputs.environment-name }}"}
      - name: Checkout Caller Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
