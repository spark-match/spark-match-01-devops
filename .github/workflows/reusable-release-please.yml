name: reusable-release-please

on:
  workflow_call:
    secrets:
      release-please-app-id:
        description: "GitHub App ID used to mint an installation token for release-please. Must be passed by the caller via `secrets.RELEASE_PLEASE_APP_ID` (or equivalent)."
        required: true
      release-please-app-private-key:
        description: "GitHub App private key (PEM) used to mint an installation token for release-please. Must be passed by the caller via `secrets.RELEASE_PLEASE_APP_PRIVATE_KEY` (or equivalent)."
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: generate-app-installation-token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.release-please-app-id }}
          private-key: ${{ secrets.release-please-app-private-key }}
      - name: run-release-please
        uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: .github/release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ steps.app-token.outputs.token }}
      - name: log-result
        if: always()
        env:
          RELEASES_CREATED: ${{ steps.release.outputs.releases_created || '0' }}
          PULL_REQUEST_URL: ${{ steps.release.outputs.pull_request_url || '(none)' }}
          UPLOAD_URL: ${{ steps.release.outputs.upload_url || '(none)' }}
        run: |
          echo "release-please result:"
          echo "  releases_created=${RELEASES_CREATED}"
          echo "  pull_request_url=${PULL_REQUEST_URL}"
          echo "  upload_url=${UPLOAD_URL}"
