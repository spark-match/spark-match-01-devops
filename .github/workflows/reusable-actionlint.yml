name: Action Lint

on:
  workflow_call:
    inputs:
      environment-name:
        description: 'Target environment name (informational, used in job name and logs).'
        type: string
        required: false
        default: 'dev'

permissions:
  contents: read

jobs:
  actionlint:
    name: "Action Lint (${{ inputs.environment-name }})"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate Inputs
        uses: spark-match/spark-match-01-devops/.github/actions/validate-workflow-inputs@main
        with:
          values: |
            {"environment-name": "${{ inputs.environment-name }}"}
      - name: Setup Action Lint
        id: setup-actionlint
        uses: spark-match/spark-match-01-devops/.github/actions/setup-actionlint@main
        with:
          version: '1.7.12'
      - name: Checkout Caller Repository
        uses: actions/checkout@v7
      - name: Run Action Lint
        run: "${{ steps.setup-actionlint.outputs.executable }} -color"
