name: actionlint

on:
  workflow_call:
    inputs:
      environment-name:
        description: 'Target environment name (informational, used in job name and logs).'
        type: string
        required: false
        default: 'dev'

permissions:
  contents: read

jobs:
  actionlint:
    name: "actionlint-${{ inputs.environment-name }}"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: validate-inputs
        uses: spark-match/spark-match-01-devops/.github/actions/validate-workflow-inputs@main
        with:
          values: |
            {"environment-name": "${{ inputs.environment-name }}"}
      - name: setup-actionlint
        id: setup-actionlint
        uses: spark-match/spark-match-01-devops/.github/actions/setup-actionlint@main
        with:
          version: '1.7.12'
      - name: checkout-caller-repository
        uses: actions/checkout@v7
      - name: run-actionlint
        run: "${{ steps.setup-actionlint.outputs.executable }} -color"
