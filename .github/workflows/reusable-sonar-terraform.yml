name: sonar-terraform

on:
  workflow_call:
    inputs:
      project-key:
        description: 'sonar-cloud project key'
        type: string
        required: true
      project-name:
        description: 'sonar-cloud project display name'
        type: string
        required: true
      organization:
        description: 'sonar-cloud organization key'
        type: string
        required: true
      sources:
        description: 'Comma-separated source paths (relative to working-directory)'
        type: string
        required: true
      exclude-patterns:
        description: 'Comma-separated glob patterns to exclude from sources'
        type: string
        required: true
      working-directory:
        description: 'Directory containing the Terraform code'
        type: string
        required: true
      env:
        description: 'Environment identifier (used in job name and logs)'
        type: string
        required: true
      fail-on-quality-gate:
        description: 'Fail the job if the quality gate status is ERROR ("true" or "false")'
        type: string
        required: true
    secrets:
      SONAR_TOKEN:
        description: 'sonar-cloud authentication token. Caller passes this explicitly (cross-owner inheritance is blocked by GitHub for cross-owner calls).'
        required: true

permissions:
  contents: read

concurrency:
  group: sonar-terraform-${{ inputs.env }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonar:
    name: "sonar-terraform-${{ inputs.env }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
        shell: bash

    steps:
      - name: validate-inputs
        uses: spark-match/spark-match-01-devops/.github/actions/validate-workflow-inputs@main
        with:
          values: |
            {
              "project-key": "${{ inputs.project-key }}",
              "project-name": "${{ inputs.project-name }}",
              "organization": "${{ inputs.organization }}",
              "sources": "${{ inputs.sources }}",
              "exclude-patterns": "${{ inputs.exclude-patterns }}",
              "working-directory": "${{ inputs.working-directory }}",
              "env": "${{ inputs.env }}",
              "fail-on-quality-gate": "${{ inputs.fail-on-quality-gate }}"
            }
          required: project-key|project-name|organization|sources|exclude-patterns|working-directory|env|fail-on-quality-gate

      - name: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true

      - name: cache-sonar-tools
        uses: actions/cache@v6
        with:
          path: ~/.sonar
          key: sonar-tools-v8.2.1-${{ runner.os }}
          restore-keys: |
            sonar-tools-v8.2.1-${{ runner.os }}

      - name: sonar-cloud-scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        uses: sonarsource/sonarqube-scan-action@v8
        with:
          projectBaseDir: ${{ inputs.working-directory }}
          args: >
            -Dsonar.projectKey=${{ inputs.project-key }}
            -Dsonar.organization=${{ inputs.organization }}
            -Dsonar.sources=${{ inputs.sources }}
            -Dsonar.exclusions=${{ inputs.exclude-patterns }}
            -Dsonar.terraform.provider.suffixes=.tf
            -Dsonar.architecture.sensor.skip=true
            -Dsonar.scanner.dumpToFile=true

      - name: sonar-cloud-quality-gate
        id: qg
        if: ${{ always() }}
        continue-on-error: true
        uses: sonarsource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        with:
          pollingTimeoutSec: 300
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

      - name: enforce-quality-gate
        if: ${{ always() && (steps.qg.outputs.quality-gate-status == 'FAILED' || (steps.qg.outcome == 'failure' && steps.qg.outputs.quality-gate-status == '')) && inputs.fail-on-quality-gate == 'true' }}
        run: |
          # Three outcomes, not two. See the long note in
          # reusable-sonar-typescript.yml: an empty status is not proof of a
          # timeout, it is what you get after ANY upstream failure, and
          # `report-task.txt` is what tells the two apart.
          if [ -n "${STEPS_QG_OUTPUTS_QUALITY_GATE_STATUS}" ]; then
            echo "::error::Quality Gate FAILED and fail-on-quality-gate=true"
          elif [ ! -f .scannerwork/report-task.txt ]; then
            echo "::error::The sonar-cloud scan failed: .scannerwork/report-task.txt was never written, so the Quality Gate was never evaluated. The real error is in the sonar-cloud-scan step above. Re-running will not fix it."
          else
            echo "::error::sonar-cloud Quality Gate polling timed out (>300s). sonar-cloud may be under maintenance (https://status.sonarcloud.io). Re-run when service is healthy."
          fi
          exit 1
        env:
          STEPS_QG_OUTPUTS_QUALITY_GATE_STATUS: ${{ steps.qg.outputs.quality-gate-status }}
