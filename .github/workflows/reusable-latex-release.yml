# =============================================================================
# Reusable Workflow: latex-release
# =============================================================================
# Compiles a latex document, auto-bumps the patch version from the latest git
# tag, creates the new tag, and publishes a GitHub Release with the PDF.
#
# USAGE (in caller repo):
#   on:
#     pull_request:
#       types: [closed]
#   jobs:
#     release:
#       if: github.event.pull_request.merged == true
#       uses: spark-match/spark-match-01-devops/.github/workflows/reusable-latex-release.yml@main
#       with:
#         root-file: main.tex
#         release-name-prefix: Spark Match Paper
#
# Caller repo needs: contents: write permission (granted via GITHUB_TOKEN).
# =============================================================================

name: latex-release

on:
  workflow_call:
    inputs:
      root-file:
        description: 'latex root file to compile.'
        type: string
        required: false
        default: 'main.tex'
      release-name-prefix:
        description: 'Prefix for the GitHub Release name (version is appended).'
        type: string
        required: false
        default: 'Release'
      release-body-template:
        description: 'Custom body for the release (Markdown). Leave empty for default.'
        type: string
        required: false
        default: ''
    outputs:
      new-version:
        description: 'New version tag created.'
        value: ${{ jobs.release.outputs.new-version }}

permissions:
  contents: write   # Required to create tags and releases

# Only one release at a time per repo. If multiple PRs merge in rapid
# succession, queue them instead of racing on tag creation.
concurrency:
  group: latex-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    name: build-release-pdf
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      new-version: ${{ steps.version.outputs.version }}
    steps:
      - name: checkout-caller-repository
        uses: actions/checkout@v7
        with:
          # Build the exact commit this pull request produced, not whatever
          # origin/main happens to point at when the runner starts. Without
          # this, two merges in quick succession both compile the second one's
          # tree while the release body advertises each PR's own merge SHA.
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0   # Need full history to find latest tag

      - name: determine-next-version
        id: version
        run: |
          # Pick the highest existing tag, NOT `git describe --tags
          # --abbrev=0`. describe returns the nearest tag reachable from HEAD
          # and, when several tags sit on one commit, it does not return the
          # highest one. Two tags landed on the same commit in
          # spark-match-06-article, describe kept answering the lower of the
          # two, and every later merge recomputed a version that was already
          # taken. sort -V over the full tag list cannot collide that way:
          # max + 1 is free by construction.
          LATEST=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -n 1)
          LATEST=${LATEST:-v0.0.0}
          CLEAN=${LATEST#v}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CLEAN"
          MAJOR=${MAJOR:-0}
          MINOR=${MINOR:-0}
          PATCH=${PATCH:-0}
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="v${MAJOR}.${MINOR}.${NEW_PATCH}"
          echo "Latest tag: ${LATEST}"
          echo "Next version: ${NEW_VERSION}"

          # Belt and braces. action-gh-release UPDATES an existing release
          # instead of failing, so a collision replaces a published PDF
          # without a single red mark anywhere. Refuse instead.
          if git rev-parse -q --verify "refs/tags/${NEW_VERSION}" >/dev/null; then
            echo "::error::Tag ${NEW_VERSION} already exists. Refusing to overwrite the release attached to it. Inspect the tag list and cut the next version by hand."
            exit 1
          fi

          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"

      - name: compile-latex-document
        uses: xu-cheng/latex-action@v4
        with:
          root_file: ${{ inputs.root-file }}

      - name: rename-pdf-with-version
        run: |
          VERSION="${STEPS_VERSION_OUTPUTS_VERSION}"
          ROOT_BASE="${INPUTS_ROOT_FILE%.tex}"
          cp "${ROOT_BASE}.pdf" "release-${VERSION}.pdf"
          ls -la release-*.pdf

        env:
          STEPS_VERSION_OUTPUTS_VERSION: ${{ steps.version.outputs.version }}
          INPUTS_ROOT_FILE: ${{ inputs.root-file }}
      - name: create-github-release-with-pdf
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          # Anchor the tag to the merge commit. The default is the SHA that
          # triggered the run, which for a closed pull request is the merge
          # REF, not the merge COMMIT, so the tag can land off the branch the
          # PDF was compiled from.
          target_commitish: ${{ github.event.pull_request.merge_commit_sha }}
          name: ${{ inputs.release-name-prefix }} - ${{ steps.version.outputs.version }}
          generate_release_notes: true
          make_latest: true
          files: release-*.pdf
          body: |
            ## ${{ inputs.release-name-prefix }} - ${{ steps.version.outputs.version }}

            Released automatically from merged Pull Request.

            ${{ inputs.release-body-template }}

            - **PR:** #${{ github.event.pull_request.number }} -- ${{ github.event.pull_request.title }}
            - **Author:** @${{ github.event.pull_request.user.login }}
            - **Merged at:** ${{ github.event.pull_request.merged_at }}
            - **SHA:** `${{ github.event.pull_request.merge_commit_sha }}`

            Download the PDF artifact attached below.
