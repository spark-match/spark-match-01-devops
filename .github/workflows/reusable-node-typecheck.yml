name: node-typecheck

on:
  workflow_call:
    inputs:
      environment-name:
        description: 'Target environment name (informational, used in job name and logs).'
        type: string
        required: false
        default: 'dev'
      node-version:
        description: 'Node.js version (passed to actions/setup-node).'
        type: string
        required: false
        default: '24'
      pkg-manager:
        description: 'JavaScript package manager (used for install + cache key). One of: npm, pnpm, yarn, bun.'
        type: string
        required: false
        default: 'npm'
      lockfile-name:
        description: 'Lockfile name relative to working-directory. Default "package-lock.json" (npm). Override for other managers.'
        type: string
        required: false
        default: 'package-lock.json'
      typecheck-script:
        description: 'npm script that runs the type checker (e.g. "typecheck" running `tsc --noEmit -p tsconfig.app.json`).'
        type: string
        required: false
        default: 'typecheck'
      working-directory:
        description: 'Working directory for npm (where the caller package.json lives). Default = repo root.'
        type: string
        required: false
        default: '.'

permissions:
  contents: read

jobs:
  typecheck:
    name: "typecheck-${{ inputs.environment-name }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
        shell: bash

    steps:
      - name: validate-inputs
        uses: spark-match/spark-match-01-devops/.github/actions/validate-workflow-inputs@main
        with:
          values: |
            {
              "pkg-manager": "${{ inputs.pkg-manager }}",
              "node-version": "${{ inputs.node-version }}",
              "lockfile-name": "${{ inputs.lockfile-name }}",
              "working-directory": "${{ inputs.working-directory }}"
            }
          enums: |
            {
              "pkg-manager": ["npm", "pnpm", "yarn", "bun"]
            }
          patterns: |
            {
              "node-version": "^[0-9]+(\\.[0-9]+){0,2}$",
              "lockfile-name": "^[A-Za-z0-9._\\-]+$"
            }

      - name: resolve-cache-key-tags
        run: |
          set -euo pipefail
          LOWER_OS="${RUNNER_OS,,}"
          ENV_NAME="${INPUTS_ENVIRONMENT_NAME,,}"
          case "$LOWER_OS" in
            linux|windows|macos) ;;
            *) echo "::error::Unsupported runner OS for cache key: '$RUNNER_OS'" >&2; exit 1 ;;
          esac
          echo "lower-os=$(printf '%s' "$LOWER_OS" | tr -d '\n\r')" >> "$GITHUB_ENV"
          echo "env-name=$(printf '%s' "$ENV_NAME" | tr -d '\n\r')" >> "$GITHUB_ENV"
          echo "Cache key segments: lower-os=$LOWER_OS node=${INPUTS_NODE_VERSION} pm=${INPUTS_PKG_MANAGER} env=$ENV_NAME"

        env:
          INPUTS_ENVIRONMENT_NAME: ${{ inputs.environment-name }}
          INPUTS_NODE_VERSION: ${{ inputs.node-version }}
          INPUTS_PKG_MANAGER: ${{ inputs.pkg-manager }}
      - name: checkout-caller-repository
        uses: actions/checkout@v7

      - name: setup-nodejs-${{ inputs.node-version }}
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          package-manager-cache: false

      - name: cache-${{ inputs.pkg-manager }}-dependencies
        uses: actions/cache@v6
        with:
          path: ~/.npm
          # Canonical cache key convention (lowercase, see docs/CACHE.md):
          #   <os>-node<nodeVersion>-<pkgmanager>-<env>-<H>
          key: ${{ env.lower-os }}-node${{ inputs.node-version }}-${{ inputs.pkg-manager }}-${{ env.env-name }}-${{ hashFiles(format('{0}/{1}', inputs.working-directory, inputs.lockfile-name)) }}
          restore-keys: |
            ${{ env.lower-os }}-node${{ inputs.node-version }}-${{ inputs.pkg-manager }}-${{ env.env-name }}-

      - name: install-dependencies
        run: npm ci

      - name: run-typecheck
        run: npm run "${INPUTS_TYPECHECK_SCRIPT}"
        env:
          INPUTS_TYPECHECK_SCRIPT: ${{ inputs.typecheck-script }}
