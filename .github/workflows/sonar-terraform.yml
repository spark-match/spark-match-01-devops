name: SonarCloud - Terraform

on:
  workflow_call:
    inputs:
      project-key:
        description: 'SonarCloud project key'
        type: string
        required: true
      project-name:
        description: 'SonarCloud project display name'
        type: string
        required: true
      organization:
        description: 'SonarCloud organization key'
        type: string
        required: true
      sources:
        description: 'Comma-separated source paths (relative to working-directory)'
        type: string
        required: true
      exclude-patterns:
        description: 'Comma-separated glob patterns to exclude from sources'
        type: string
        required: true
      working-directory:
        description: 'Directory containing the Terraform code'
        type: string
        required: true
      env:
        description: 'Environment identifier (used in job name and logs)'
        type: string
        required: true
      fail-on-quality-gate:
        description: 'Fail the job if the quality gate status is ERROR ("true" or "false")'
        type: string
        required: true
    secrets:
      SONAR_TOKEN:
        description: 'SonarCloud authentication token. Caller passes this explicitly (cross-owner inheritance is blocked by GitHub for cross-owner calls).'
        required: true

permissions:
  contents: read

concurrency:
  group: sonar-terraform-${{ inputs.env }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonar:
    name: "SonarCloud Terraform (${{ inputs.env }})"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}

    steps:
      - name: Validate inputs
        uses: spark-match/spark-match-01-devops/.github/actions/validate-workflow-inputs@main
        with:
          values: |
            {
              "project-key": "${{ inputs.project-key }}",
              "project-name": "${{ inputs.project-name }}",
              "organization": "${{ inputs.organization }}",
              "sources": "${{ inputs.sources }}",
              "exclude-patterns": "${{ inputs.exclude-patterns }}",
              "working-directory": "${{ inputs.working-directory }}",
              "env": "${{ inputs.env }}",
              "fail-on-quality-gate": "${{ inputs.fail-on-quality-gate }}"
            }
          required: project-key|project-name|organization|sources|exclude-patterns|working-directory|env|fail-on-quality-gate

      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          submodules: true

      - name: Cache Sonar tools (scanner, GPG keys, embedded runtime)
        uses: actions/cache@v4
        with:
          path: ~/.sonar
          key: sonar-tools-v8.2.1-${{ runner.os }}
          restore-keys: |
            sonar-tools-v8.2.1-${{ runner.os }}

      - name: SonarCloud Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        uses: sonarsource/sonarqube-scan-action@v8.2.1
        with:
          projectBaseDir: ${{ inputs.working-directory }}
          args: >
            -Dsonar.projectKey=${{ inputs.project-key }}
            -Dsonar.organization=${{ inputs.organization }}
            -Dsonar.sources=${{ inputs.sources }}
            -Dsonar.exclusions=${{ inputs.exclude-patterns }}
            -Dsonar.terraform.provider.suffixes=.tf
            -Dsonar.architecture.sensor.skip=true
            -Dsonar.scanner.dumpToFile=true

      - name: SonarCloud Quality Gate
        id: qg
        if: ${{ always() }}
        continue-on-error: true
        uses: sonarsource/sonarqube-quality-gate-action@v1.2.0
        timeout-minutes: 5
        with:
          pollingTimeoutSec: 300
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

      - name: Enforce Quality Gate
        if: ${{ always() && (steps.qg.outputs.quality-gate-status == 'FAILED' || (steps.qg.outcome == 'failure' && steps.qg.outputs.quality-gate-status == '')) && inputs.fail-on-quality-gate == 'true' }}
        run: |
          if [ -z "${{ steps.qg.outputs.quality-gate-status }}" ]; then
            echo "::error::SonarCloud Quality Gate polling timed out (>300s). SonarCloud may be under maintenance (https://status.sonarcloud.io). Re-run when service is healthy."
          else
            echo "::error::Quality Gate FAILED and fail-on-quality-gate=true"
          fi
          exit 1
