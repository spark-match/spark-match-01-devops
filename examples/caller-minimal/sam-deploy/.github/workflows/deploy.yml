#
# Minimal caller for the AWS SAM deploy pipeline:
#   cfn-nag -> lambda-permission-source-arn -> sam-deploy
#
# This workflow runs on push to main. For PR-triggered static analysis
# only, drop the sam-deploy job and the push trigger.

name: Deploy - SAM dev

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write       # OIDC for AWS deploy role

concurrency:
  group: sam-deploy-dev-${{ github.ref }}
  cancel-in-progress: false   # deploy in flight must complete or be rolled back manually

jobs:
  cfn-nag:
    name: cfn-nag (env=dev)
    uses: spark-match/spark-match-01-devops/.github/workflows/cfn-nag.yml@main
    with:
      environment-name: dev
      cfn-nag-version: '0.8.10'
      ruby-version: '3.3'
      scan-paths: 'template.yaml contexts/'
      # output-format optional; pass 'json' for machine-readable

  lambda-permission-source-arn:
    name: lambda-permission-source-arn (env=dev)
    uses: spark-match/spark-match-01-devops/.github/workflows/lambda-permission-source-arn.yml@main
    with:
      environment-name: dev
      python-version: '3.12'
      scan-paths: 'template.yaml contexts/'

  sam-deploy:
    name: sam-deploy (env=dev)
    needs: [cfn-nag, lambda-permission-source-arn]
    uses: spark-match/spark-match-01-devops/.github/workflows/sam-deploy.yml@main
    with:
      environment-name: dev
      aws-region: us-east-1
      stack-name: <MY_STACK_NAME>
      # sam-template defaults to 'template.yaml'
      # sam-config-env defaults to environment-name (dev)
      # s3-bucket defaults to '' (uses samconfig.toml or auto-managed)
      # pre-build-script defaults to 'build:shared'
      # build-layers-script defaults to 'layer:build:all'
      sam-cli-version: '1.151.0'
      node-version: '24'
    secrets:
      AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
